<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10171f">
<title>MCU / CAD · Interactive 3D Assembly</title>
<style>
:root{color-scheme:dark;--bg:#10171f;--panel:#111a23ed;--line:#34424e;--text:#e5edf5;--muted:#8294a5;--mint:#91d1c5}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #34404d;background:#0c1117;position:relative;z-index:2}.brand{letter-spacing:.18em;font-weight:700}.mark{border:1px solid #8ebeb8;border-radius:8px;padding:5px;margin-right:8px;color:#9ad5cc}.subtitle{font-size:11px;color:#8295a8}
main{height:calc(100dvh - 58px);min-height:440px;position:relative;background:radial-gradient(ellipse at 50% 42%,#1b2b39,#10171f 68%)}#stage{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.views{position:absolute;top:14px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:3;max-width:85%}
button{background:#17222d;color:#dce8f1;border:1px solid #435260;border-radius:12px;padding:9px 11px;font-size:12px;cursor:pointer;min-height:38px}button:active,button.active{background:#2c4c56;border-color:#91d1c5}
.hint{position:absolute;top:65px;left:12px;font-size:11px;color:#9cabb9;background:#111a23b8;border:1px solid #2a3b48;padding:7px 10px;border-radius:10px;pointer-events:none}
.panel{position:absolute;bottom:12px;left:12px;right:12px;padding:12px;border:1px solid #34424e;border-radius:18px;background:#111a23ed;z-index:3;max-width:680px;margin:auto;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}.row+.row{margin-top:10px}.label{font-size:12px;min-width:66px}.range{flex:1;min-width:60px;accent-color:#91d1c5}.pct{font-size:12px;min-width:32px;text-align:right;color:#b7dcd5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:95px}.note{font-size:11px;color:#8294a5;margin-top:8px}.error{position:absolute;top:45%;left:16px;right:16px;text-align:center;color:#c5d4df;background:#111a23d9;padding:12px;border-radius:10px}
@media(min-width:800px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}.views{right:max(12px,calc((100% - 1100px)/2))}header{padding:0 max(14px,calc((100% - 1100px)/2))}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">M3</span> MCU / CAD</div><div class="subtitle">INTERACTIVE 3D ASSEMBLY</div></header>
<main><div id="stage"><canvas id="cad-canvas"></canvas></div>
<div class="views"><button data-view="iso" class="active">3D</button><button data-view="front">正视</button><button data-view="side">侧视</button><button data-view="top">俯视</button><button data-view="bottom">底视</button></div>
<div class="hint">拖动旋转 · 双指缩放 · 轻触选择零件</div>
<div id="cad-error" class="error">正在加载三维模型…</div>
<div class="panel">
 <div class="row"><label class="label" for="cad-explode">爆炸分层</label><input id="cad-explode" class="range" type="range" min="0" max="100" value="18"><span id="cad-pct" class="pct">18%</span></div>
 <div class="row actions"><button id="cad-spin">自动旋转：开</button><button id="cad-reset">重置视角</button><button id="cad-assemble">完整装配</button><button id="cad-explode-btn">爆炸分解</button></div>
 <div class="row actions"><button id="cad-wire">线框：关</button><button id="cad-alpha">透明外壳：关</button><button id="cad-hide">隐藏选中零件</button><button id="cad-show">显示全部零件</button></div>
 <div class="row actions"><button id="cad-focus">聚焦选中零件</button><button id="cad-isolate">仅显示选中零件</button><button id="cad-clear-selection">取消选择</button></div>
 <div class="row"><label class="label" for="cad-opacity">整体透明度</label><input id="cad-opacity" class="range" type="range" min="25" max="100" value="100"><span id="cad-opacity-pct" class="pct">100%</span></div>
 <div id="cad-selection" class="note" aria-live="polite">选中零件：未选择（轻触或双击模型上的零件进行选择）</div>
 <div class="note">可拖动旋转、缩放；滑动分层条查看内部组件。此为视觉演示模型，并非原厂尺寸工程图。</div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('cad-canvas'),err=document.getElementById('cad-error'),stage=document.getElementById('stage');
if(!window.THREE){err.textContent='无法加载 Three.js。请检查网络后刷新页面。';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10171f);scene.fog=new THREE.Fog(0x10171f,18,36);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
let renderer;const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);try{renderer=new THREE.WebGLRenderer({canvas,antialias:!isMobile,alpha:false,powerPreference:'high-performance'})}catch(e){err.textContent='浏览器无法启动 WebGL，或显卡加速不可用。请更新浏览器并启用硬件加速后刷新。';console.error(e);return}renderer.setPixelRatio(Math.min(devicePixelRatio||1,isMobile?1.5:2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
scene.add(new THREE.HemisphereLight(0xdceaff,0x26313b,2.1));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,9,7);scene.add(key);
const rim=new THREE.DirectionalLight(0x53b9d4,2.1);rim.position.set(-6,3,-6);scene.add(rim);
const mat=(c,metal=.25,rough=.35)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const aluminum=mat(0x9aa9b7,.82,.24),bright=mat(0xdce4eb,.8,.2),graphite=mat(0x202a34,.55,.3),black=mat(0x10161d,.3,.32),green=mat(0x165346,.25,.4),green2=mat(0x267c68,.25,.35),gold=mat(0xc4a15d,.78,.22),copper=mat(0xb27c43,.75,.26),blue=mat(0x326b89,.45,.3);
const assembly=new THREE.Group();scene.add(assembly);const layers=[];
function layer(y){const g=new THREE.Group();g.position.y=y;assembly.add(g);layers.push({g,y});return g}
function box(g,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.name='结构件 '+(g.children.length+1);o.position.set(x,y,z);g.add(o);return o}
function cylinder(g,r,h,m,x,y,z){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),m);o.name='圆柱/紧固件 '+(g.children.length+1);o.position.set(x,y,z);g.add(o);return o}
const base=layer(-1.12);
box(base,5.5,.4,3.55,blue,0,0,0);box(base,5.24,.16,3.3,graphite,0,.24,0);box(base,4.98,.1,3.08,aluminum,0,.34,0);
for(let i=0;i<22;i++)box(base,.055,.17,.24,gold,-1.65+i*.157,.02,1.82);
box(base,3.85,.17,.27,black,0,.02,1.8);
for(const x of [-2.35,2.35])for(const z of [-1.35,1.35])cylinder(base,.12,.12,bright,x,.45,z);
const shield=layer(-.57);
box(shield,5.15,.16,3.23,graphite,0,0,0);box(shield,4.98,.07,3.06,bright,0,.11,0);
for(const x of [-2.3,2.3])for(const z of [-1.3,1.3])cylinder(shield,.13,.08,graphite,x,.17,z);
const pcbLayer=layer(.03);
box(pcbLayer,4.85,.15,2.94,green,0,0,0);box(pcbLayer,4.55,.025,2.7,green2,0,.087,0);
for(let i=0;i<14;i++)box(pcbLayer,.018,.014,1.9,copper,-1.9+i*.29,.108,0);
for(let i=0;i<9;i++)box(pcbLayer,2.4,.014,.018,copper,0,.11,-1.1+i*.27);
for(let i=0;i<6;i++)for(let j=0;j<4;j++)cylinder(pcbLayer,.035,.025,gold,-2.05+i*.78,.12,-1.12+j*.72);
const chips=[[-1.68,-.72,.65,.53],[-1.68,.62,.65,.53],[1.38,-.72,.72,.58],[1.38,.02,.72,.58],[1.38,.75,.72,.48],[-.1,1.02,.55,.34]];
for(const [x,z,w,d] of chips){box(pcbLayer,w,.19,d,black,x,.22,z);box(pcbLayer,w*.82,.055,d*.78,graphite,x,.34,z);for(let i=0;i<5;i++){box(pcbLayer,.055,.035,.05,bright,x-w*.31+i*w*.155,.39,z-d*.23);box(pcbLayer,.055,.035,.05,bright,x-w*.31+i*w*.155,.39,z+d*.23)}for(let i=0;i<4;i++){box(pcbLayer,.045,.035,.05,gold,x-w*.42,.28,z-d*.25+i*d*.16);box(pcbLayer,.045,.035,.05,gold,x+w*.42,.28,z-d*.25+i*d*.16)}}
box(pcbLayer,1.2,.2,1.05,black,.05,.27,-.02);box(pcbLayer,1.08,.055,.93,graphite,.05,.39,-.02);
for(let i=0;i<18;i++){const p=-.44+i*.057;box(pcbLayer,.026,.07,.08,gold,p,.36,-.57);box(pcbLayer,.026,.07,.08,gold,p,.36,.53)}
for(let i=0;i<15;i++)box(pcbLayer,.12,.11,.065,bright,2.3,.18,-1.25+i*.175);

// Additional board-level detail: illustrative passives, mounting posts and edge connectors.
function namedBox(g,w,h,d,m,x,y,z,name){const o=box(g,w,h,d,m,x,y,z);o.name=name;return o}
function namedCylinder(g,r,h,m,x,y,z,name){const o=cylinder(g,r,h,m,x,y,z);o.name=name;return o}
for(const [x,z] of [[-2.18,-1.08],[-2.18,1.08],[2.18,-1.08],[2.18,1.08]]){
  namedCylinder(pcbLayer,.095,.16,gold,x,.19,z,'PCB 安装柱');
  namedCylinder(pcbLayer,.052,.17,bright,x,.21,z,'安装柱螺钉');
}
for(let row=0;row<3;row++)for(let col=0;col<8;col++){
  const x=-1.7+col*.34,z=-.15+row*.25;
  namedBox(pcbLayer,.17,.075,.105,black,x,.19,z,'贴片元件');
  namedBox(pcbLayer,.035,.078,.11,gold,x-.09,.19,z,'贴片焊端');
  namedBox(pcbLayer,.035,.078,.11,gold,x+.09,.19,z,'贴片焊端');
}
for(let i=0;i<3;i++){
  const x=-1.75+i*1.75;
  namedBox(pcbLayer,.88,.34,.42,blue,x,.22,1.48,'板边连接器外壳');
  namedBox(pcbLayer,.68,.20,.035,black,x,.24,1.704,'连接器插口');
  for(let p=0;p<6;p++)namedBox(pcbLayer,.045,.045,.035,gold,x-.225+p*.09,.23,1.727,'连接器触点');
  namedBox(pcbLayer,.88,.34,.42,blue,x,.22,-1.48,'板边连接器外壳');
  namedBox(pcbLayer,.68,.20,.035,black,x,.24,-1.704,'连接器插口');
  for(let p=0;p<6;p++)namedBox(pcbLayer,.045,.045,.035,gold,x-.225+p*.09,.23,-1.727,'连接器触点');
}
for(const x of [-2.32,2.32]){
  namedBox(pcbLayer,.28,.30,.78,graphite,x,.22,0,'侧边接口模块');
  namedBox(pcbLayer,.06,.18,.52,bright,x+(x>0?.16:-.16),.24,0,'接口金属边框');
}
const thermal=layer(.66);box(thermal,4.98,.14,3.12,copper,0,0,0);box(thermal,5.12,.12,3.24,graphite,0,.1,0);
// Cooling-fin detail pass: illustrative geometry, not an OEM dimensional drawing.
for(let i=0;i<15;i++){const x=-2.16+i*.308;namedBox(thermal,.105,.31,2.66,aluminum,x,.315,0,'散热鳍片');}
for(const x of [-2.38,2.38])for(const z of [-1.42,1.42])namedCylinder(thermal,.075,.08,gold,x,.2,z,'散热器固定螺钉');
for(let i=0;i<8;i++){const x=-1.65+i*.47;namedBox(thermal,.19,.035,.13,black,x,.205,-1.18,'导热垫');namedBox(thermal,.19,.035,.13,black,x,.205,1.18,'导热垫');}
const lid=layer(1.2);const outerShell=box(lid,5.4,.22,3.52,aluminum,0,0,0);outerShell.userData.shell=true;const shellInset=box(lid,5.05,.07,3.18,bright,0,.15,0);shellInset.userData.shell=true;box(lid,4.82,.06,2.95,graphite,0,.21,0);
for(let i=0;i<15;i++){const x=-2.2+i*.315;box(lid,.105,.34,2.55,bright,x,.39,0);box(lid,.14,.055,2.58,aluminum,x,.57,0)}
for(const x of [-2.48,2.48])for(const z of [-1.5,1.5]){cylinder(lid,.105,.07,graphite,x,.18,z);cylinder(lid,.062,.08,bright,x,.23,z)}
const grid=new THREE.GridHelper(18,36,0x334654,0x243441);grid.position.y=-1.72;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x10171f,.05,.9));floor.rotation.x=-Math.PI/2;floor.position.y=-1.74;scene.add(floor);
let radius=11.7,az=.68,pol=1.04,auto=true,drag=false,lastX=0,lastY=0,pointers=new Map(),lastPinch=0,pointerStart=null,pointerMoved=false;
const cameraTarget=new THREE.Vector3(0,0,0);
let wireframeOn=false,transparentOn=false,opacityValue=1,selectedMesh=null;
const originalMaterials=new Map(),hiddenMeshes=new Set();
let isolatedMesh=null;
function eachMesh(fn){assembly.traverse(o=>{if(o.isMesh)fn(o)})}
function rememberMaterial(o){if(!originalMaterials.has(o)){const original=o.material,source=Array.isArray(original)?original:[original];originalMaterials.set(o,{material:original,working:source.map(m=>m.clone()),transparent:null})}}
function applyAppearance(){eachMesh(o=>{rememberMaterial(o);const entry=originalMaterials.get(o),mats=entry.working,showThrough=transparentOn&&!!o.userData.shell,transparent=showThrough||opacityValue<1;if(entry.transparent!==transparent){mats.forEach(m=>m.needsUpdate=true);entry.transparent=transparent}mats.forEach(m=>{m.wireframe=wireframeOn;m.transparent=transparent;m.opacity=opacityValue*(showThrough?0.42:1);m.depthWrite=m.opacity>=0.999;if(m.emissive)m.emissive.setHex(o===selectedMesh?0x24584e:0x000000)});o.material=Array.isArray(entry.material)?mats: mats[0];o.visible=!hiddenMeshes.has(o)&&(!isolatedMesh||o===isolatedMesh||isDescendantOf(o,isolatedMesh))})}
function isDescendantOf(o,parent){let p=o;while(p){if(p===parent)return true;p=p.parent}return false}
function selectAt(clientX,clientY){const rect=canvas.getBoundingClientRect(),mouse=new THREE.Vector2(((clientX-rect.left)/rect.width)*2-1,-((clientY-rect.top)/rect.height)*2+1),ray=new THREE.Raycaster();ray.setFromCamera(mouse,camera);const hits=ray.intersectObjects(assembly.children,true).filter(h=>h.object.isMesh&&h.object.visible);if(!hits.length)return;selectedMesh=hits[0].object;document.getElementById('cad-selection').textContent='已选中零件：'+(selectedMesh.name||selectedMesh.geometry.type+' 零件')+'（可隐藏或调整整体显示效果）';eachMesh(o=>{if(o.userData._selectedOriginal){const mats=Array.isArray(o.material)?o.material:[o.material];mats.forEach(m=>{if(m.emissive)m.emissive.setHex(0x000000)});o.userData._selectedOriginal=false}});selectedMesh.userData._selectedOriginal=true;applyAppearance()}
function place(){pol=Math.max(.12,Math.min(Math.PI-.12,pol));radius=Math.max(5,Math.min(24,radius));camera.position.set(cameraTarget.x+radius*Math.sin(pol)*Math.sin(az),cameraTarget.y+radius*Math.cos(pol),cameraTarget.z+radius*Math.sin(pol)*Math.cos(az));camera.lookAt(cameraTarget)}
function setExplode(v){document.getElementById('cad-pct').textContent=v+'%';const gap=v*.008;layers.forEach((l,i)=>l.g.position.y=l.y+(i-2.5)*gap)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();place();setExplode(18);err.style.display='none';applyAppearance();
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY;pointerStart={x:e.clientX,y:e.clientY};pointerMoved=false}else if(pointers.size===2){pointerStart=null;const a=[...pointers.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=false}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>6)pointerMoved=true;if(pointers.size===1&&drag){az-=(e.clientX-lastX)*.008;pol-=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY;place()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)radius*=lastPinch/d;lastPinch=d;place()}});
function pointerEnd(e){const shouldSelect=e.type==='pointerup'&&pointerStart&&!pointerMoved&&pointers.size===1;if(shouldSelect)selectAt(e.clientX,e.clientY);pointers.delete(e.pointerId);drag=false;lastPinch=0;pointerStart=null;pointerMoved=false}canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('wheel',e=>{radius*=e.deltaY>0?1.08:.92;place()},{passive:true});
canvas.addEventListener('dblclick',e=>selectAt(e.clientX,e.clientY));
document.getElementById('cad-wire').onclick=e=>{wireframeOn=!wireframeOn;e.target.textContent='线框：'+(wireframeOn?'开':'关');e.target.classList.toggle('active',wireframeOn);applyAppearance()};
document.getElementById('cad-alpha').onclick=e=>{transparentOn=!transparentOn;e.target.textContent='透明外壳：'+(transparentOn?'开':'关');e.target.classList.toggle('active',transparentOn);applyAppearance()};
document.getElementById('cad-opacity').addEventListener('input',e=>{opacityValue=Number(e.target.value)/100;document.getElementById('cad-opacity-pct').textContent=e.target.value+'%';applyAppearance()});
document.getElementById('cad-hide').onclick=()=>{if(!selectedMesh){document.getElementById('cad-selection').textContent='请先双击模型上的一个零件';return}hiddenMeshes.add(selectedMesh);selectedMesh.visible=false;document.getElementById('cad-selection').textContent='已隐藏：'+selectedMesh.name;selectedMesh=null};
document.getElementById('cad-show').onclick=()=>{hiddenMeshes.clear();isolatedMesh=null;eachMesh(o=>o.visible=true);document.getElementById('cad-selection').textContent='已显示全部零件';applyAppearance()};
document.getElementById('cad-focus').onclick=()=>{if(!selectedMesh){document.getElementById('cad-selection').textContent='请先选择一个零件';return}const p=new THREE.Vector3();selectedMesh.getWorldPosition(p);cameraTarget.copy(p);place();document.getElementById('cad-selection').textContent='已聚焦：'+selectedMesh.name+'（拖动可继续旋转）'};
document.getElementById('cad-isolate').onclick=()=>{if(!selectedMesh){document.getElementById('cad-selection').textContent='请先选择一个零件';return}isolatedMesh=selectedMesh;hiddenMeshes.clear();applyAppearance();document.getElementById('cad-selection').textContent='仅显示：'+selectedMesh.name};
document.getElementById('cad-clear-selection').onclick=()=>{selectedMesh=null;isolatedMesh=null;hiddenMeshes.clear();document.getElementById('cad-selection').textContent='已取消选择并显示全部零件';applyAppearance()};
document.getElementById('cad-explode').addEventListener('input',e=>setExplode(+e.target.value));
document.getElementById('cad-spin').onclick=e=>{auto=!auto;e.target.textContent='自动旋转：'+(auto?'开':'关');e.target.classList.toggle('active',!auto)};
document.getElementById('cad-reset').onclick=()=>{radius=11.7;az=.68;pol=1.04;cameraTarget.set(0,0,0);camera.lookAt(cameraTarget);isolatedMesh=null;hiddenMeshes.clear();selectedMesh=null;eachMesh(o=>o.visible=true);document.getElementById('cad-explode').value=18;setExplode(18);place();applyAppearance();document.getElementById('cad-selection').textContent='选中零件：未选择'};
document.getElementById('cad-assemble').onclick=()=>{document.getElementById('cad-explode').value=0;setExplode(0)};
document.getElementById('cad-explode-btn').onclick=()=>{document.getElementById('cad-explode').value=70;setExplode(70)};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=11.7;const v=b.dataset.view;if(v==='front'){az=0;pol=Math.PI/2}else if(v==='side'){az=Math.PI/2;pol=Math.PI/2}else if(v==='top'){az=0;pol=.12}else if(v==='bottom'){az=0;pol=Math.PI-.12}else{az=.68;pol=1.04}place()});
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
function tick(){if(auto&&!drag&&!document.hidden)assembly.rotation.y+=.0022;renderer.render(scene,camera)}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();err.style.display='block';err.textContent='3D 图形上下文已中断，请刷新页面恢复模型。';renderer.setAnimationLoop(null)});
try{renderer.setAnimationLoop(tick)}catch(e){err.style.display='block';err.textContent='三维模型初始化失败，请刷新页面重试。';console.error(e)}
})();
</script>
</body>
</html>
