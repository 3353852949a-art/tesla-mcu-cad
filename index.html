function updateExplode(){explosion=Number($('explode').value)/100;$('explodeVal').textContent=Math.round(explosion*100)+'%';for(const id in groups){const v=partMeta[id].explode;groups[id].position.set(v[0]*explosion,v[1]*explosion,v[2]*explosion);}}
function setWire(){wire=!wire;for(const g of Object.values(groups))g.traverse(o=>{if(o.isMesh&&o.material&&!o.userData.noPick){if(Array.isArray(o.material))o.material.forEach(m=>m.wireframe=wire);else o.material.wireframe=wire;}});$('wireBtn').classList.toggle('active',wire);}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/Math.max(1,h);camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
renderer.domElement.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false,id:e.pointerId};last.x=e.clientX;last.y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-last.x,dy=e.clientY-last.y;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>4)drag.moved=true;if(e.pointerType==='touch'||e.buttons){yaw-=dx*.008;pitch+=dy*.008;updateCamera();}last.x=e.clientX;last.y=e.clientY;});
renderer.domElement.addEventListener('pointerup',e=>{if(!drag)return;if(!drag.moved){const r=renderer.domElement.getBoundingClientRect();pointer.x=((e.clientX-r.left)/r.width)*2-1;pointer.y=-((e.clientY-r.top)/r.height)*2+1;raycaster.setFromCamera(pointer,camera);const hits=raycaster.intersectObjects(Object.values(groups),true);for(const h of hits){let o=h.object;while(o&& !o.userData.partId)o=o.parent;if(o&&groups[o.userData.partId]){select(o.userData.partId);break;}}}drag=null;});
renderer.domElement.addEventListener('wheel',e=>{distance=Math.max(6,Math.min(24,distance+e.deltaY*.012));updateCamera();},{passive:true});
let touchDist=0;
renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length===2)touchDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(e.touches.length===2){const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);if(touchDist){distance=Math.max(6,Math.min(24,distance-(d-touchDist)*.025));updateCamera();}touchDist=d;}},{passive:true});
document.querySelectorAll('.part').forEach(b=>b.addEventListener('click',()=>select(b.dataset.part)));
$('explode').addEventListener('input',updateExplode);$('explodeQuick').addEventListener('click',()=>{const v=Number($('explode').value)>0?0:68;$('explode').value=v;updateExplode();$('explodeQuick').classList.toggle('active',v>0);});
$('wireBtn').addEventListener('click',setWire);
$('resetBtn').addEventListener('click',()=>{yaw=.65;pitch=.48;distance=13.4;target.set(0,0,0);updateCamera();});
$('rotate').addEventListener('input',()=>{autoRotate=Number($('rotate').value)===1;$('rotateVal').textContent=autoRotate?'开启':'关闭';});
$('showAll').addEventListener('click',()=>{hidden.clear();for(const id in groups)groups[id].visible=true;$('status').textContent='所有部件已显示';});
$('hideSelected').addEventListener('click',()=>{groups[selected].visible=false;hidden.add(selected);$('status').textContent=partMeta[selected].label+' · 已隐藏';});
$('focusSelected').addEventListener('click',()=>{const p=new THREE.Box3().setFromObject(groups[selected]).getCenter(new THREE.Vector3());target.lerp(p,.8);distance=Math.max(7,distance*.78);updateCamera();});
updateExplode();select('lid');
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(autoRotate&&!drag){yaw+=dt*.18;updateCamera();}renderer.render(scene,camera);}
animate();
$('loading').classList.add('hide');$('status').textContent='三维模型就绪 · 拖动旋转 / 双指缩放';
</script>
</body></html>
