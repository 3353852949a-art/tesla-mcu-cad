<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#09121a"><title>Model 3 Car Computer · Three.js</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09121a;color:#e3edf1;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:calc(15px + env(safe-area-inset-top));left:16px;z-index:2;pointer-events:none;text-shadow:0 2px 10px #000}.top strong{display:block;font-size:14px;letter-spacing:.13em}.top span{display:block;margin-top:5px;color:#91a8b3;font-size:11px;letter-spacing:.04em}.controls{position:fixed;z-index:3;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:9px}.controls button{height:45px;padding:0 15px;border-radius:24px;border:1px solid #405866;background:#101d28ed;color:#e3edf1;font-size:13px;white-space:nowrap;touch-action:manipulation}.controls button.active{border-color:#63d7bb;color:#9bf4dc;background:#12372f}.hint{position:fixed;left:0;right:0;bottom:calc(75px + env(safe-area-inset-bottom));text-align:center;color:#9aadb7;font-size:11px;pointer-events:none;text-shadow:0 2px 8px #000}.status{position:fixed;z-index:5;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:#09121a;color:#cbd8df;font-size:14px;line-height:1.7}.status small{display:block;color:#91a7b2;margin-top:10px;max-width:300px}.status[hidden]{display:none}
</style></head><body>
<div id="stage"></div><div class="top"><strong>MODEL 3 · CAR COMPUTER</strong><span>THREE.JS · SERVICE-MANUAL-BASED EXTERNAL ASSEMBLY</span></div>
<div class="hint">单指旋转 · 双指缩放</div><div class="controls"><button id="explode" class="active">拆解视图</button><button id="wire">线框</button><button id="reset">复位</button></div>
<div class="status" id="status">正在加载 Three.js…<small>首次打开需要联网加载三维引擎</small></div>
<script type="module">
const status=document.getElementById('status');
try{
const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
const stage=document.getElementById('stage'),scene=new THREE.Scene();scene.background=new THREE.Color(0x09121a);scene.fog=new THREE.Fog(0x09121a,18,35);
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;stage.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9edff,0x1b242b,2.0));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,8,8);scene.add(key);
const rim=new THREE.DirectionalLight(0x57c7c0,2.1);rim.position.set(-7,4,-5);scene.add(rim);
const fill=new THREE.DirectionalLight(0x7799c0,1.1);fill.position.set(-6,1,7);scene.add(fill);
const root=new THREE.Group();scene.add(root);
const groups={housing:new THREE.Group(),ports:new THREE.Group(),connectors:new THREE.Group(),visor:new THREE.Group(),mounts:new THREE.Group()};Object.values(groups).forEach(g=>root.add(g));
const materials=[];
function mat(color,metalness=0,roughness=.4){const m=new THREE.MeshStandardMaterial({color,metalness,roughness});materials.push(m);return m;}
const m={cast:mat(0x737f86,.78,.3),edge:mat(0x9ca8ae,.82,.26),dark:mat(0x20282e,.4,.42),black:mat(0x10171c,.18,.48),plastic:mat(0x303b43,.15,.42),gold:mat(0xb99a62,.7,.3),copper:mat(0x9e6842,.68,.32),blue:mat(0x31505f,.38,.3),hose:mat(0x171e22,.08,.65),label:mat(0xc7c9c2,.12,.55)};
function box(parent,x,y,z,sx,sy,sz,material,bevel=0){const geo=new THREE.BoxGeometry(sx,sy,sz);const mesh=new THREE.Mesh(geo,material);mesh.position.set(x,y,z);parent.add(mesh);if(bevel){const e=new THREE.EdgesGeometry(geo);mesh.add(new THREE.LineSegments(e,new THREE.LineBasicMaterial({color:0x0a1014,transparent:true,opacity:.24})));}return mesh;}
function cyl(parent,x,y,z,r1,r2,len,material,axis='y',segments=24){const mesh=new THREE.Mesh(new THREE.CylinderGeometry(r1,r2,len,segments),material);mesh.position.set(x,y,z);if(axis==='z')mesh.rotation.x=Math.PI/2;if(axis==='x')mesh.rotation.z=Math.PI/2;parent.add(mesh);return mesh;}
function stud(x,y,z){cyl(groups.mounts,x,y,z,.07,.07,.18,m.edge);cyl(groups.mounts,x,y+.1,z,.11,.11,.035,m.gold);}
 // Service-manual-inspired die-cast car computer enclosure: proportions are illustrative, not factory CAD.
box(groups.housing,0,0,0,5.15,2.1,3.1,m.cast,.075);
box(groups.housing,0,1.075,0,4.95,.12,2.9,m.edge,.025);
box(groups.housing,0,-1.075,0,4.85,.12,2.8,m.dark,.025);
 // Reinforcing ribs on the cast shell
for(let i=0;i<9;i++){let x=-2.12+i*.53;box(groups.housing,x,.05,-1.565,.075,1.65,.045,m.edge,.008);box(groups.housing,x,.05,1.565,.075,1.65,.045,m.edge,.008);}
for(let i=0;i<5;i++){let z=-1.15+i*.575;box(groups.housing,-2.59,.02,z,.04,1.45,.07,m.dark,.008);box(groups.housing,2.59,.02,z,.04,1.45,.07,m.dark,.008);}
 // Raised cooling manifold / paired coolant ports along lower edge
box(groups.ports,.25,-.9,1.68,1.8,.42,.28,m.dark,.045);
for(let i=0;i<2;i++){let x=-.28+i*1.06;cyl(groups.ports,x,-.88,1.91,.26,.26,.32,m.hose,'z',32);cyl(groups.ports,x,-.88,2.085,.205,.205,.08,m.edge,'z',32);cyl(groups.ports,x,-.88,2.135,.15,.15,.035,m.black,'z',32);for(let j=0;j<6;j++){let a=j*Math.PI/3;box(groups.ports,x+Math.cos(a)*.19,-.88+Math.sin(a)*.19,2.13,.045,.045,.04,m.edge,.004);}}
 // Connector banks on left and right sides: counts are representative and may vary by revision.
function connectorBank(side,count){let x=side<0?-2.68:2.68;for(let i=0;i<count;i++){let z=-1.25+(i%6)*.49,y=.55-Math.floor(i/6)*.66;const width=(i%4===0)?.36:.28,height=(i%3===0)?.31:.23;box(groups.connectors,x,y,z,width,.16,height,m.black,.025);box(groups.connectors,x+side*.1,y,z,width*.55,.12,height*.67,i%3===0?m.blue:m.plastic,.012);for(let k=0;k<3;k++)box(groups.connectors,x+side*.18,y-.035,z-height*.24+k*height*.24,.035,.055,.035,m.gold,.003);}}
connectorBank(-1,10);connectorBank(1,7);
 // Front connector strip, ground strap lug and harness retaining clips
box(groups.connectors,0,.42,1.62,1.5,.42,.16,m.black,.02);
for(let i=0;i<3;i++){let x=-.48+i*.48;box(groups.connectors,x,.43,1.73,.31,.23,.1,m.blue,.012);box(groups.connectors,x,.43,1.79,.12,.1,.04,m.edge,.005);}
cyl(groups.connectors,-2.08,.86,1.64,.12,.12,.08,m.gold,'z');cyl(groups.connectors,-2.08,.86,1.7,.055,.055,.04,m.edge,'z');
for(let i=0;i<2;i++){box(groups.connectors,-.45+i*.9,1.18,-.15,.2,.1,.48,m.black,.015);box(groups.connectors,-.45+i*.9,1.23,-.15,.1,.05,.25,m.edge,.008);}
 // Six mounting studs: the manual notes four-stud and six-stud revisions.
[[-2.15,-1.15],[-2.15,1.15],[0,-1.48],[0,1.48],[2.15,-1.15],[2.15,1.15]].forEach(p=>stud(p[0],-1.28,p[1]));
 // Removable protective visor with four clip points, shown separated in exploded view.
box(groups.visor,0,1.72,.12,5.25,.18,3.18,m.plastic,.065);
box(groups.visor,0,1.83,.12,4.95,.07,2.85,m.dark,.04);
for(let i=0;i<4;i++){let x=i<2?-2.05:2.05,z=i%2?1.25:-1.25;box(groups.visor,x,1.58,z,.22,.2,.16,m.edge,.015);box(groups.visor,x,1.46,z,.1,.12,.1,m.black,.01);}
for(let i=0;i<6;i++)box(groups.visor,-2.1+i*.84,1.83,-1.48,.18,.04,.035,m.edge,.005);
 // Ground plane and subtle grid
const floor=new THREE.Mesh(new THREE.CircleGeometry(13,64),new THREE.MeshStandardMaterial({color:0x0c151c,roughness:.94,metalness:.05}));floor.rotation.x=-Math.PI/2;floor.position.y=-2.05;scene.add(floor);
const grid=new THREE.GridHelper(22,44,0x243b45,0x172831);grid.position.y=-2.04;scene.add(grid);
const initial={yaw:-.42,pitch:.3,distance:12.8};let yaw=initial.yaw,pitch=initial.pitch,distance=initial.distance,exploded=true,wire=false;
function applyView(){root.rotation.order='YXZ';root.rotation.y=yaw;root.rotation.x=pitch;camera.position.set(Math.sin(yaw)*distance,4.0+Math.sin(pitch)*2,Math.cos(yaw)*distance);camera.lookAt(0,.05,0);}
function setExplode(on){exploded=on;groups.visor.position.y=on?1.15:0;groups.ports.position.y=on?-.12:0;groups.connectors.position.x=on?0:0;groups.mounts.position.y=on?-.08:0;document.getElementById('explode').classList.toggle('active',on);}
function setWire(on){wire=on;materials.forEach(a=>a.wireframe=on);document.getElementById('wire').classList.toggle('active',on);}
let pointers=new Map(),last=null,pinchStart=0,distStart=distance;const el=renderer.domElement;
el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);distStart=distance;}});
el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>0)distance=Math.max(7.5,Math.min(21,distStart*pinchStart/Math.max(1,d)));}else if(last){yaw+=(e.clientX-last.x)*.009;pitch=Math.max(-.7,Math.min(.8,pitch+(e.clientY-last.y)*.007));}last={x:e.clientX,y:e.clientY};applyView();});
function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=0;last=null;}el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);el.addEventListener('wheel',e=>{distance=Math.max(7.5,Math.min(21,distance+e.deltaY*.012));applyView();},{passive:true});
document.getElementById('explode').addEventListener('click',()=>setExplode(!exploded));document.getElementById('wire').addEventListener('click',()=>setWire(!wire));document.getElementById('reset').addEventListener('click',()=>{yaw=initial.yaw;pitch=initial.pitch;distance=initial.distance;setExplode(true);setWire(false);applyView();});
function resize(){camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?43:37;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);applyView();}
window.addEventListener('resize',resize);setExplode(true);applyView();resize();status.hidden=true;
function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();
}catch(err){console.error(err);status.hidden=false;status.innerHTML='Three.js 加载失败<small>请确认网络可以访问 jsDelivr CDN，再刷新页面。<br>错误：'+String(err&&err.message||err).replace(/[<>&]/g,'')+'</small>';}
</script></body></html>
