<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1017">
<title>Tesla MCU · Three.js 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09121a;color:#dce8ed;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:none}#stage{position:absolute;inset:0}canvas{display:block;width:100%;height:100%;touch-action:none}.top{position:fixed;top:calc(14px + env(safe-area-inset-top));left:16px;z-index:2;pointer-events:none;text-shadow:0 2px 12px #000}.top strong{display:block;font-size:15px;letter-spacing:.14em;font-weight:650}.top span{display:block;margin-top:5px;font-size:11px;color:#8fa5b0;letter-spacing:.06em}.controls{position:fixed;z-index:3;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:10px}.controls button{height:46px;min-width:48px;padding:0 15px;border-radius:24px;border:1px solid #405766;background:#101d28ed;color:#dce8ed;font-size:13px;box-shadow:0 5px 22px #0008;touch-action:manipulation}.controls button.active{border-color:#58d9b8;color:#8ef4d9;background:#12352e}.hint{position:fixed;left:0;right:0;bottom:calc(78px + env(safe-area-inset-bottom));text-align:center;color:#9aadb7;font-size:11px;pointer-events:none;text-shadow:0 2px 8px #000}.status{position:fixed;z-index:5;inset:0;display:grid;place-content:center;text-align:center;padding:28px;background:#09121a;color:#cbd8df;font-size:14px;line-height:1.7}.status small{display:block;color:#91a7b2;margin-top:10px;max-width:290px}.status[hidden]{display:none}
</style></head>
<body>
<div id="stage"></div>
<div class="top"><strong>TESLA MCU</strong><span>MEDIA CONTROL UNIT · 3D ASSEMBLY</span></div>
<div class="hint">单指旋转 · 双指缩放</div>
<div class="controls"><button id="explode" class="active">拆解视图</button><button id="wire">线框</button><button id="reset">复位</button></div>
<div class="status" id="status">正在加载三维引擎…<small>首次打开需要加载 Three.js</small></div>
<script type="module">
const status=document.getElementById('status');
try {
 const THREE=await import('https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js');
 const stage=document.getElementById('stage');
 const scene=new THREE.Scene(); scene.background=new THREE.Color(0x09121a); scene.fog=new THREE.Fog(0x09121a,18,36);
 const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100); camera.position.set(8,7.2,10.5);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'low-power'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5)); renderer.setSize(innerWidth,innerHeight); renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.18; stage.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xcfe9ff,0x18232b,2.0));
 const key=new THREE.DirectionalLight(0xffffff,3.0);key.position.set(5,9,7);scene.add(key);
 const rim=new THREE.DirectionalLight(0x59c9c0,2.2);rim.position.set(-7,4,-5);scene.add(rim);
 const fill=new THREE.DirectionalLight(0x7194c0,1.0);fill.position.set(-5,1,6);scene.add(fill);
 const root=new THREE.Group();scene.add(root);
 const groups={base:new THREE.Group(),board:new THREE.Group(),chips:new THREE.Group(),ports:new THREE.Group(),lid:new THREE.Group()};
 Object.values(groups).forEach(g=>root.add(g));
 function mat(color,metalness=0,roughness=.5){return new THREE.MeshStandardMaterial({color,metalness,roughness});}
 const m={al:mat(0x8797a0,.78,.3),silver:mat(0xc6d1d5,.72,.24),dark:mat(0x202b33,.3,.4),black:mat(0x10171c,.15,.5),pcb:mat(0x08744b,.18,.38),green:mat(0x16895d,.15,.35),gold:mat(0xc89b4c,.72,.27),copper:mat(0xb56c39,.65,.32),chip:mat(0x263942,.35,.32),chipTop:mat(0x61747b,.62,.28),blue:mat(0x2c5268,.35,.32)};
 function box(parent,x,y,z,sx,sy,sz,material,bevel=.025){const geo=new THREE.BoxGeometry(sx,sy,sz);const mesh=new THREE.Mesh(geo,material);mesh.position.set(x,y,z);parent.add(mesh);if(bevel){const edges=new THREE.EdgesGeometry(geo);const lines=new THREE.LineSegments(edges,new THREE.LineBasicMaterial({color:0x0a141a,transparent:true,opacity:.22}));mesh.add(lines);}return mesh;}
 // Metal enclosure and lower tray
 box(groups.base,0,-.43,0,5.8,.42,3.72,m.al);
 box(groups.base,0,-.19,0,5.48,.12,3.38,m.black);
 for(let i=0;i<14;i++)box(groups.base,-2.48+i*.382,-.185,0,.055,.035,2.78,m.silver,.008);
 for(let i=0;i<8;i++)box(groups.base,-2.84,-.4,-1.3+i*.37,.12,.16,.045,m.dark,.01);
 // Main PCB and trace-like details
 box(groups.board,0,-.015,0,4.72,.13,2.82,m.pcb,.045);
 for(let i=0;i<14;i++)box(groups.board,-2.12+i*.326,.055,0,.018,.008,2.35,m.copper,.002);
 for(let i=0;i<8;i++)box(groups.board,0,.056,-1.05+i*.3,4.12,.008,.018,m.copper,.002);
 for(let i=0;i<5;i++)for(let j=0;j<2;j++)box(groups.board,-2.0+i*.98,.064,j?1.12:-1.12,.105,.014,.105,m.gold,.008);
 // Main processor stack
 box(groups.chips,0,.16,0,1.52,.22,1.32,m.dark);
 box(groups.chips,0,.29,0,1.27,.08,1.07,m.chipTop);
 box(groups.chips,0,.345,0,1.02,.045,.82,m.silver,.008);
 box(groups.chips,0,.378,0,.86,.035,.66,m.chip,.008);
 // Power ICs, inductors, capacitors and small components
 for(let i=0;i<4;i++)for(let j=0;j<2;j++){let x=-1.72+i*1.14,z=j?0.88:-.88;box(groups.chips,x,.12,z,.48,.14,.4,m.dark);box(groups.chips,x,.205,z,.38,.04,.3,m.chipTop);box(groups.chips,x,.232,z,.25,.018,.2,m.silver,.005);}
 for(let i=0;i<4;i++){let x=-1.28+i*.86;box(groups.chips,x,.17,-1.02,.42,.36,.42,m.dark);box(groups.chips,x,.36,-1.02,.35,.035,.35,m.silver);box(groups.chips,x,.382,-1.02,.12,.018,.12,m.gold,.004);}
 for(let i=0;i<10;i++){let x=-1.82+(i%5)*.9,z=i<5?-.55:.55;box(groups.chips,x,.105,z,.25,.08,.18,m.chip,.012);box(groups.chips,x,.151,z,.19,.015,.12,m.gold,.003);}
 // Side connectors
 for(let i=0;i<3;i++){let z=-.72+i*.72;box(groups.ports,2.48,-.12,z,.58,.43,.43,m.dark);box(groups.ports,2.8,-.1,z,.3,.26,.31,m.gold);for(let j=0;j<4;j++)box(groups.ports,2.98,-.1,z-.105+j*.07,.12,.055,.04,m.silver,.004);}
 box(groups.ports,-2.47,-.12,.93,.48,.34,.32,m.dark);
 for(let i=0;i<8;i++)box(groups.ports,-2.72,-.12,.69+i*.068,.12,.055,.032,m.gold,.004);
 // Lid, underside gasket and screw heads
 box(groups.lid,0,1.0,0,5.65,.17,3.58,m.al,.065);
 box(groups.lid,0,.89,0,4.98,.035,2.96,m.black,.02);
 for(let i=0;i<5;i++)for(let j=0;j<2;j++){const screw=new THREE.Mesh(new THREE.CylinderGeometry(.075,.075,.025,20),m.silver);screw.position.set(-2.2+i*1.1,1.1,j?1.35:-1.35);groups.lid.add(screw);}
 // Ground grid and soft floor
 const grid=new THREE.GridHelper(22,44,0x25404b,0x182a34);grid.position.y=-1.45;scene.add(grid);
 const floor=new THREE.Mesh(new THREE.CircleGeometry(12,64),new THREE.MeshStandardMaterial({color:0x0b151d,roughness:.9,metalness:.1}));floor.rotation.x=-Math.PI/2;floor.position.y=-1.47;scene.add(floor);
 const initial={yaw:-.42,pitch:.35,distance:14};let yaw=initial.yaw,pitch=initial.pitch,distance=initial.distance,exploded=true,wire=false;
 root.rotation.order='YXZ';
 function applyView(){root.rotation.y=yaw;root.rotation.x=pitch;camera.position.set(Math.sin(yaw)*distance,5.2+Math.sin(pitch)*2,Math.cos(yaw)*distance);camera.lookAt(0,.05,0);}
 function setExplode(on){exploded=on;groups.base.position.y=on?-.35:0;groups.board.position.y=on?.08:0;groups.chips.position.y=on?.34:0;groups.ports.position.y=on?.18:0;groups.lid.position.y=on?1.05:0;document.getElementById('explode').classList.toggle('active',on);}
 function setWire(on){wire=on;Object.values(m).forEach(material=>material.wireframe=on);document.getElementById('wire').classList.toggle('active',on);}
 let pointers=new Map(),last=null,pinchStart=0,distStart=distance;
 const el=renderer.domElement;
 el.addEventListener('pointerdown',e=>{el.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(pointers.size===2){const a=[...pointers.values()];pinchStart=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);distStart=distance;}});
 el.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size>=2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(pinchStart>0)distance=Math.max(8,Math.min(22,distStart*pinchStart/Math.max(1,d)));}else if(last){yaw+=(e.clientX-last.x)*.009;pitch=Math.max(-.65,Math.min(.85,pitch+(e.clientY-last.y)*.007));}last={x:e.clientX,y:e.clientY};applyView();});
 function end(e){pointers.delete(e.pointerId);if(pointers.size<2)pinchStart=0;last=null;}
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 el.addEventListener('wheel',e=>{distance=Math.max(8,Math.min(22,distance+e.deltaY*.012));applyView();},{passive:true});
 document.getElementById('explode').addEventListener('click',()=>setExplode(!exploded));
 document.getElementById('wire').addEventListener('click',()=>setWire(!wire));
 document.getElementById('reset').addEventListener('click',()=>{yaw=initial.yaw;pitch=initial.pitch;distance=initial.distance;setExplode(true);setWire(false);applyView();});
 function resize(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.fov=w<600?43:38;camera.updateProjectionMatrix();renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(w,h);applyView();}
 window.addEventListener('resize',resize);setExplode(true);applyView();resize();status.hidden=true;
 function animate(){requestAnimationFrame(animate);renderer.render(scene,camera);}animate();
} catch(err) {
 console.error(err);status.hidden=false;status.innerHTML='三维引擎加载失败<small>请确认网络可以访问 jsDelivr CDN，然后刷新页面。<br>错误：'+String(err&&err.message||err).replace(/[<>&]/g,'')+'</small>';
}
</script></body></html>
