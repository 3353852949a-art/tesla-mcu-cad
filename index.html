<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1017">
<title>MCU 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0a1017;color:#e8f1f5;font-family:system-ui,sans-serif;touch-action:none}
body{background:radial-gradient(ellipse at 50% 40%,#253946 0,#121e28 48%,#080d13 100%)}
.stage{position:absolute;inset:0;perspective:1000px;overflow:hidden;touch-action:none}
.world{position:absolute;left:50%;top:45%;width:0;height:0;transform-style:preserve-3d;transform:rotateX(-26deg) rotateY(-34deg) scale(.82);will-change:transform}
.part{position:absolute;left:0;top:0;transform-style:preserve-3d;will-change:transform}
.face{position:absolute;backface-visibility:hidden;border:1px solid #0003;box-shadow:inset 0 0 0 1px #ffffff08}
.front,.back{left:0;top:0;width:var(--w);height:var(--h)}
.front{transform:translateZ(calc(var(--d)/2))}
.back{transform:rotateY(180deg) translateZ(calc(var(--d)/2));filter:brightness(.68)}
.right,.left{left:0;top:0;width:var(--d);height:var(--h)}
.right{left:calc((var(--w) - var(--d))/2);transform:rotateY(90deg) translateZ(calc(var(--w)/2));filter:brightness(.78)}
.left{left:calc((var(--w) - var(--d))/2);transform:rotateY(-90deg) translateZ(calc(var(--w)/2));filter:brightness(.62)}
.top,.bottom{left:0;top:calc((var(--h) - var(--d))/2);width:var(--w);height:var(--d)}
.top{transform:rotateX(90deg) translateZ(calc(var(--h)/2));filter:brightness(1.12)}
.bottom{transform:rotateX(-90deg) translateZ(calc(var(--h)/2));filter:brightness(.55)}
.wire .face{background:transparent!important;border:1px solid #a7ffe0!important;box-shadow:none}
.controls{position:fixed;z-index:3;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px}
button{width:48px;height:48px;border-radius:50%;border:1px solid #536b78;background:#101a24e8;color:#dce9ee;font:22px/1 system-ui,sans-serif;box-shadow:0 6px 24px #0007;touch-action:manipulation}
button.active{border-color:#6ee7c8;color:#8ef4d9;background:#15372f}
.hint{position:fixed;top:calc(14px + env(safe-area-inset-top));left:0;right:0;text-align:center;color:#c7d7df88;font-size:12px;pointer-events:none}
</style></head>
<body>
<div class="stage" id="stage"><div class="world" id="world"></div></div>
<div class="hint">拖动旋转 · 双指缩放</div>
<div class="controls"><button id="explode" class="active" aria-label="爆炸视图">⤢</button><button id="wire" aria-label="线框">▦</button><button id="reset" aria-label="复位">↺</button></div>
<script>
(function(){
'use strict';
var world=document.getElementById('world'),stage=document.getElementById('stage'),unit=43,parts=[];
var C={al:'#8798a1',silver:'#c5d0d4',dark:'#202c35',rubber:'#11171c',pcb:'#08734b',green:'#16845b',gold:'#c7953e',copper:'#a9572c',chip:'#263740',chipTop:'#65747a',ceramic:'#bdbdaf',blue:'#2e5065'};
function add(x,y,z,sx,sy,sz,color,group){parts.push({x:x,y:y,z:z,sx:sx,sy:sy,sz:sz,color:color,group:group||'fixed'});}
add(0,-.42,0,5.7,.38,3.65,C.al,'base');add(0,-.22,0,5.35,.12,3.3,C.dark,'base');
for(var i=0;i<13;i++)add(-2.45+i*.408,-.19,0,.075,.035,2.85,C.silver,'base');
add(0,-.015,0,4.55,.12,2.55,C.pcb,'board');
for(i=0;i<13;i++)add(-1.95+i*.325,.052,0,.026,.009,1.95,C.copper,'board');
for(i=0;i<7;i++)add(0,.055,-.9+i*.3,3.8,.009,.022,C.copper,'board');
for(i=0;i<4;i++)for(var j=0;j<2;j++)add(-2.05+i*1.36,.061,-1.05+j*2.1,.12,.015,.12,C.gold,'board');
add(0,.16,0,1.5,.22,1.28,C.dark,'compute');add(0,.29,0,1.23,.09,1.02,C.chip,'compute');add(0,.345,0,.98,.045,.79,C.silver,'compute');add(0,.375,0,.82,.035,.63,C.chip,'compute');
for(i=0;i<6;i++){var x=-1.55+(i%3)*1.55,z=i<3?-.7:.7;add(x,.14,z,.72,.25,.58,C.dark,'power');add(x,.29,z,.56,.06,.43,C.chipTop,'power');for(var k=0;k<4;k++)add(x-.19+k*.125,.335,z,.065,.025,.34,C.silver,'power');}
for(i=0;i<4;i++){x=-1.35+i*.9;add(x,.18,-1.03,.46,.42,.46,C.dark,'power');add(x,.405,-1.03,.39,.035,.39,C.silver,'power');add(x,.428,-1.03,.13,.02,.13,C.gold,'power');}
for(i=0;i<8;i++){x=-1.72+(i%4)*1.15;z=i<4?-.92:.92;add(x,.11,z,.36,.1,.23,C.chip,'power');add(x,.18,z,.28,.035,.15,C.gold,'power');}
for(i=0;i<3;i++){z=-.72+i*.72;add(2.45,-.12,z,.6,.46,.45,C.dark,'connectors');add(2.79,-.1,z,.3,.27,.32,C.gold,'connectors');for(k=0;k<4;k++)add(2.98,-.1,z-.12+k*.08,.13,.065,.045,C.silver,'connectors');}
add(-2.42,-.12,.95,.5,.36,.32,C.dark,'connectors');for(i=0;i<8;i++)add(-2.7,-.12,.72+i*.065,.13,.06,.032,C.gold,'connectors');
add(0,1.05,0,5.52,.16,3.48,C.al,'lid');add(0,.91,0,4.9,.025,2.9,C.rubber,'seal');
for(i=0;i<5;i++)for(j=0;j<2;j++)add(-2.25+i*1.125,1.145,j?1.35:-1.35,.14,.055,.14,C.silver,'lid');
function make(p){var el=document.createElement('div');el.className='part';el.style.setProperty('--w',(p.sx*unit)+'px');el.style.setProperty('--h',(p.sy*unit)+'px');el.style.setProperty('--d',(p.sz*unit)+'px');var y=-p.y*unit,z=p.z*unit,x=p.x*unit;el.dataset.group=p.group;el.dataset.x=x;el.dataset.y=y;el.dataset.z=z;el.style.width=(p.sx*unit)+'px';el.style.height=(p.sy*unit)+'px';el.style.transform='translate3d('+x+'px,'+y+'px,'+z+'px) translate(-50%,-50%)';['front','back','right','left','top','bottom'].forEach(function(face){var f=document.createElement('div');f.className='face '+face;f.style.background=p.color;el.appendChild(f);});world.appendChild(el);p.el=el;}
parts.forEach(make);
var yaw=-34,pitch=-26,zoom=.82,exploded=true,wire=false,points=new Map(),last=null,pinch=0,startZoom=zoom;
function render(){world.style.transform='rotateX('+pitch+'deg) rotateY('+yaw+'deg) scale('+zoom+')';parts.forEach(function(p){var dy=0;if(exploded){if(p.group==='lid')dy=-1.15*unit;else if(p.group==='seal')dy=-.72*unit;else if(p.group==='compute')dy=-.38*unit;else if(p.group==='power')dy=-.25*unit;else if(p.group==='connectors')dy=-.18*unit;else if(p.group==='board')dy=-.08*unit;else if(p.group==='base')dy=.3*unit;}p.el.style.transform='translate3d('+p.el.dataset.x+'px,'+(Number(p.el.dataset.y)+dy)+'px,'+p.el.dataset.z+'px) translate(-50%,-50%)';});}
function distance(){var a=Array.from(points.values());return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
stage.addEventListener('pointerdown',function(e){stage.setPointerCapture(e.pointerId);points.set(e.pointerId,{x:e.clientX,y:e.clientY});last={x:e.clientX,y:e.clientY};if(points.size===2){pinch=distance();startZoom=zoom;}});
stage.addEventListener('pointermove',function(e){if(!points.has(e.pointerId))return;points.set(e.pointerId,{x:e.clientX,y:e.clientY});if(points.size>1){var d=distance();if(pinch>0)zoom=Math.max(.48,Math.min(1.5,startZoom*d/pinch));}else if(last){yaw+=(e.clientX-last.x)*.55;pitch=Math.max(-75,Math.min(75,pitch+(e.clientY-last.y)*.45));}last={x:e.clientX,y:e.clientY};render();});
function end(e){points.delete(e.pointerId);if(points.size<2)pinch=0;last=points.size?Array.from(points.values())[0]:null;}
stage.addEventListener('pointerup',end);stage.addEventListener('pointercancel',end);
document.getElementById('explode').addEventListener('click',function(){exploded=!exploded;this.classList.toggle('active',exploded);render();});
document.getElementById('wire').addEventListener('click',function(){wire=!wire;world.classList.toggle('wire',wire);this.classList.toggle('active',wire);});
document.getElementById('reset').addEventListener('click',function(){yaw=-34;pitch=-26;zoom=.82;exploded=true;wire=false;world.classList.remove('wire');document.getElementById('explode').classList.add('active');document.getElementById('wire').classList.remove('active');render();});
render();
})();
</script></body></html>
