<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8">

<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#080d13;color:#edf3f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}

</style></head><body>
<div id="stage"></div>
<header class="top"><span>DRIVE UNIT INVERTER</span><b>Model 3 电机控制器 MCU</b></header>
<div id="lab"></div><div id="err"></div>
<div id="panel">

</div>
<script>function showErr(m){var e=document.getElementById('err');e.textContent=m||'Three.js 未能加载,请检查手机网络后刷新页面。';e.style.display='block'}</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="showErr()"></script>
<script>
(function(){

[[0xfff0db,1.5,5,9,7],[0x6bafff,1,-7,3,-5],[0xffffff,.6,0,-3,5]].forEach(a=>{const l=new T.DirectionalLight(a[0],a[1]);l.position.set(a[2],a[3],a[4]);scene.add(l)});

const M=(c,m,ro)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:ro});
const al=M('#8997a3',.78,.32),lidM=M('#aeb9c3',.72,.3),dk=M('#202c37',.48,.4),bk=M('#111a23',.25,.42),cu=M('#c99d55',.82,.27),gd=M('#e0c17f',.75,.28),pcb=M('#19745f',.2,.5),chip=M('#273540',.35,.35),sv=M('#d0d8de',.8,.24),bl=M('#31566a',.35,.38);
const root=new T.Group();scene.add(root);const parts=[];let cur;
function P(id,name,off,shell,bs,src){const g=new T.Group();bs=bs||[0,0,0];g.userData={id,name,src:src||'apx',base:new T.Vector3(bs[0],bs[1],bs[2]),exp:new T.Vector3(off[0],off[1],off[2]),shell:!!shell};root.add(g);parts.push(g);cur=g}
function B(x,y,z,a,b,c,m){const o=new T.Mesh(new T.BoxGeometry(a,b,c),m);o.position.set(x,y,z);cur.add(o)}
function C(x,y,z,rad,h,m,ax){const o=new T.Mesh(new T.CylinderGeometry(rad,rad,h,20),m);o.position.set(x,y,z);if(ax==='x')o.rotation.z=Math.PI/2;if(ax==='z')o.rotation.x=Math.PI/2;cur.add(o)}

function U(p,rad,m){const c=new T.CatmullRomCurve3(p.map(a=>new T.Vector3(a[0],a[1],a[2])));cur.add(new T.Mesh(new T.TubeGeometry(c,32,rad,8,false),m))}
function Bt(x,y,z,rad){C(x,y,z,rad,.055,sv);B(x,y+.032,z,.075,.012,.075,dk)}
// 1 下壳体
P('housing','下壳体(铸铝)',[0,0,0],true);
B(0,-.43,0,5.65,.22,3.65,al);B(-2.72,-.04,0,.21,.64,3.65,al);B(2.72,-.04,0,.21,.64,3.65,al);B(0,-.04,-1.72,5.65,.64,.21,al);B(0,-.04,1.72,5.65,.64,.21,al);
B(0,.30,-1.62,5.25,.08,.09,dk);B(0,.30,1.62,5.25,.08,.09,dk);B(-2.57,.30,0,.09,.08,3.15,dk);B(2.57,.30,0,.09,.08,3.15,dk);
B(0,-.48,0,6.05,.1,4.05,al);for(const x of[-2,-.67,.67,2])for(const z of[-1.93,1.93])Bt(x,-.4,z,.07);for(const x of[-2.93,2.93])for(const z of[-.6,.6])Bt(x,-.4,z,.07);
for(let s=-1;s<=1;s+=2)for(let i=0;i<5;i++){const z=-1.15+i*.575;B(s*2.835,-.03,z,.055,.36,.095,dk);B(s*2.868,-.03,z,.018,.30,.045,al)}
P('gasket','逆变器密封垄',[0,-.55,0],false,[0,0,0],'ref');
B(0,-.57,0,6.0,.04,4.0,bk);
// 2 上盖
P('lid','上盖',[0,2.4,0],true);
B(0,.48,0,5.38,.18,3.36,lidM);B(0,.585,0,5.04,.055,3.02,al);
for(let i=0;i<7;i++)B(-1.85+i*.62,.62,0,.09,.035,2.30,al);
for(const x of[-2.35,2.35])for(const z of[-1.25,1.25])Bt(x,.62,z,.07);
for(const z of[-1.48,1.48]){B(0,.285,z,4.72,.025,.035,sv);for(let i=0;i<9;i++)C(-2.05+i*.51,.285,z,.045,.026,dk)}
// 3 高压接口 4 信号接口
P('hv','高压插座(HV Header)',[0,0,1.1]);
B(-1.62,.02,2.02,1.18,.57,.54,dk);B(-1.62,.05,2.33,.95,.39,.14,bk);B(-1.62,.27,2.12,1.03,.08,.32,bl);for(let i=0;i<2;i++)B(-1.87+i*.5,.28,2.30,.16,.05,.05,gd);

B(1.63,.02,2.02,.86,.45,.48,bl);B(1.63,.02,2.30,.66,.29,.12,bk);for(let i=0;i<7;i++)B(1.36+i*.09,.03,2.37,.027,.13,.022,gd);
// 5 冷却接头
P('cool','冷却液进/出口接头',[1.2,0,0]);
for(const z of[-.67,.67]){C(2.94,.05,z,.26,.46,sv,'x');C(3.19,.05,z,.20,.10,bl,'x');O(3.23,.05,z,.15,.035,bk,'x');C(3.25,.05,z,.105,.04,bk,'x')}
// 6 三相输出端子
P('phase','三相输出端子',[0,1.5,0]);
B(.12,.39,-.16,2.15,.12,1.55,dk);
for(let i=0;i<3;i++){const x=-.58+i*.7;B(x,.50,-.16,.36,.18,.68,cu);C(x,.60,-.40,.105,.035,gd);O(x,.621,-.40,.067,.014,bk);C(x,.665,-.40,.135,.045,sv);O(x,.69,-.40,.105,.018,cu);C(x,.70,-.40,.065,.055,gd)}
P('phcov','三相检修盖(2×螺栓)',[0,3.2,0],false,[0,0,0],'ref');
B(.12,.80,-.30,2.5,.07,1.1,lidM);Bt(-.95,.855,-.30,.07);Bt(1.19,.855,-.30,.07);
// 7 功率基板与模块
P('heat','针翅散热底板',[0,.3,0],false,[0,0,0],'ref');
B(0,-.12,0,4.72,.12,2.72,al);
for(let i=0;i<12;i++)for(let j=0;j<7;j++)C(-2+i*.36,-.24,-1+j*.33,.045,.12,sv);
P('power','SiC 功率模块 ×24',[0,.75,0],false,[0,0,0],'ref');
for(let p=0;p<3;p++)for(let c=0;c<2;c++)for(let k=0;k<4;k++){const x=-1.4+p*1.4+(c?.27:-.27),z=-.58+k*.39;B(x,0,z,.4,.1,.3,chip);B(x,.065,z,.14,.03,.2,gd)}
// 8 直流电容
P('cap','直流母线电容',[0,.95,.5]);
for(let i=0;i<4;i++){const x=-1.65+i*.9;C(x,.08,.92,.18,.40,sv);C(x,.29,.92,.14,.035,dk);C(x,.315,.92,.06,.018,gd)}
// 9 控制板
P('ctrl','控制板与线束接插件',[0,1.65,-.6],false,[0,.3,0]);
B(.08,.03,-.93,2.35,.12,.63,pcb);for(let i=0;i<7;i++)B(-.82+i*.28,.115,-.93,.13,.08,.19,chip);for(let i=0;i<8;i++)B(-.83+i*.24,.11,-.64,.045,.035,.045,gd);
for(let i=0;i<4;i++){const x=-1.55+i*1.03;C(x,.01,-1.17,.075,.22,sv);C(x,.13,-1.17,.045,.035,gd)}
for(let i=0;i<5;i++)B(-2.12+i*.18,.02,1.08,.08,.07,.28,bl);
// 10 母排
P('bus','铜母排',[0,1.0,0]);
for(let i=0;i<3;i++){const x=-.58+i*.58;B(x,.2,-.05,.13,.06,1.58,cu);B(x,.25,.63,.24,.05,.17,gd);U([[x,.14,.25],[x,.22,.48],[x,.22,.68],[x+.12,.2,.82]],.045,cu);C(x+.12,.2,.82,.075,.045,gd)}
// 每个网格独立材质(便于高亮/透明/线框)
parts.forEach(g=>g.children.forEach(m=>{m.material=m.material.clone();m.userData.e=m.material.emissive.getHex()}));
// 状态
let sel=null,iso=null,ex=0,exT=0,wire=false;const ol=new T.BoxHelper(root,0xffc857);ol.material.depthTest=false;ol.renderOrder=10;ol.visible=false;scene.add(ol);const bx=new T.Box3(),c3=new T.Vector3();const hid=new Set(),chips={};
function vis(g){return iso?g===iso:!hid.has(g)}
function refresh(){
 parts.forEach(g=>{g.visible=vis(g);const on=g===sel;g.children.forEach(m=>m.material.emissive.setHex(on?0x1d4f82:m.userData.e));chips[g.userData.id].className=(on?'on ':'')+(vis(g)?'':'off')});
 ol.visible=!!sel&&vis(sel);$('#lab').style.display=ol.visible?'block':'none';if(sel)$('#lab').textContent=sel.userData.name;
 $('#info').textContent=sel?sel.userData.name+(hid.has(sel)?'(已隐藏)':'')+' · '+(sel.userData.src==='ref'?'结构依据维修手册条目/公开拆解资料,尺寸近似':'近似建模'):'点击模型零件选中,或从下方列表选择';
 $('#bHide').textContent=sel&&hid.has(sel)?'显示':'隐藏';$('#bIso').className=iso?'on':'';
}
parts.forEach(g=>{const b=document.createElement('button');b.textContent=g.userData.name.replace(/\(.*\)/,'');b.onclick=()=>{sel=sel===g?null:g;refresh()};$('#chips').appendChild(b);chips[g.userData.id]=b});
$('#bHide').onclick=()=>{if(!sel)return;hid.has(sel)?hid.delete(sel):hid.add(sel);if(iso===sel)iso=null;refresh()};
$('#bIso').onclick=()=>{if(!sel)return;iso=iso===sel?null:sel;hid.delete(sel);refresh()};
$('#bAll').onclick=()=>{hid.clear();iso=null;refresh()};
$('#bNone').onclick=()=>{sel=null;refresh()};
$('#bEx').onclick=()=>{exT=exT?0:1;$('#bEx').className=exT?'on':''};
$('#bWire').onclick=()=>{wire=!wire;parts.forEach(g=>g.children.forEach(m=>m.material.wireframe=wire));$('#bWire').className=wire?'on':''};
$('#op').oninput=e=>{const v=e.target.value/100;$('#opv').textContent=e.target.value+'%';parts.forEach(g=>{if(g.userData.shell)g.children.forEach(m=>{m.material.transparent=v<1;m.material.opacity=v;m.material.depthWrite=v>.99;m.material.needsUpdate=true})})};
// 相机
let az=.7,el=.5,zoom=1;const V={front:[0,0],side:[Math.PI/2,0],top:[0,1.5],bottom:[0,-1.5],iso:[.7,.5]};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{const v=V[b.dataset.v];az=v[0];el=v[1]});
$('#bReset').onclick=()=>{az=.7;el=.5;zoom=1;exT=0;$('#bEx').className='';$('#op').value=100;$('#op').oninput({target:$('#op')});hid.clear();iso=null;sel=null;refresh()};
function cam(){const rad=11/zoom*(innerWidth<innerHeight?1.5:1),ty=.4+ex*.5;camera.position.set(rad*Math.cos(el)*Math.sin(az),ty+rad*Math.sin(el),rad*Math.cos(el)*Math.cos(az));camera.lookAt(0,ty,0)}
function rs(){const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.setViewOffset(w,h,0,Math.round($('#panel').offsetHeight*.45),w,h);r.setPixelRatio(Math.min(devicePixelRatio||1,1.8));r.setSize(w,h)}
addEventListener('resize',rs);rs();
// 手势:单指旋转、双指缩放、轻点选中
const cv=r.domElement,ptr=new Map(),ray=new T.Raycaster();let lp=0,dn=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});if(ptr.size===1)dn={t:performance.now(),m:0};else{dn=null;const a=[...ptr.values()];lp=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}});
cv.addEventListener('pointermove',e=>{const o=ptr.get(e.pointerId);if(!o)return;const dx=e.clientX-o.x,dy=e.clientY-o.y;o.x=e.clientX;o.y=e.clientY;
 if(ptr.size>1){const a=[...ptr.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lp)zoom=cl(zoom*d/lp,.6,2.4);lp=d}
 else{if(dn)dn.m+=Math.abs(dx)+Math.abs(dy);az-=dx*.008;el=cl(el+dy*.006,-1.5,1.5)}});
function up(e){if(dn&&ptr.size===1&&dn.m<8&&performance.now()-dn.t<500)pick(e);ptr.delete(e.pointerId);lp=0;dn=null}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>{ptr.delete(e.pointerId);lp=0;dn=null});
cv.addEventListener('wheel',e=>{zoom=cl(zoom*(e.deltaY>0?.93:1.07),.6,2.4);e.preventDefault()},{passive:false});
function pick(e){ray.setFromCamera({x:e.clientX/innerWidth*2-1,y:-(e.clientY/innerHeight)*2+1},camera);
 const h=ray.intersectObjects(parts.filter(g=>g.visible),true);const hit=h.find(i=>i.object.visible&&(i.object.material.opacity>.3));sel=hit?hit.object.parent:null;refresh()}
function tick(){requestAnimationFrame(tick);ex+=(exT-ex)*.12;if(Math.abs(exT-ex)<.001)ex=exT;const p=ex*ex*(3-2*ex);parts.forEach(g=>g.position.lerpVectors(g.userData.base,g.userData.exp,p));cam();camera.updateMatrixWorld();
 if(ol.visible){ol.setFromObject(sel);bx.setFromObject(sel);bx.getCenter(c3);c3.y=bx.max.y;c3.project(camera);const l=$('#lab');l.style.left=(c3.x+1)/2*innerWidth+'px';l.style.top=((1-c3.y)/2*innerHeight-16)+'px'}
 r.render(scene,camera)}
refresh();tick();
}catch(err){console.error(err);showErr('渲染初始化失败(设备可能不支持 WebGL):'+err.message)}
})();
</script></body></html>
