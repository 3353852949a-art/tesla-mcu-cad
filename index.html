add(hv,B(6,4,3),mOr,-9.5,3.6,-12.4);add(hv,B(7,5,.3),mRub,-9.5,3.6,-10.9);add(hv,B(2.5,.6,1),mBk,-9.5,5.8,-12.4);
const lv=part('lv','低压信号连接器','黑色多针低压接口,含防水密封(针数为示意)。',[0,0,-1],[[.76,1,5]]);
add(lv,B(8,3.5,2.4),mBk,8,3.6,-12.2);add(lv,B(9,4.5,.3),mRub,8,3.6,-10.9);
for(let i=0;i<6;i++)for(let j=0;j<2;j++)add(lv,B(.3,.3,.5),mSil,5.5+i*.5*1.0*2.0/2,3.1+j*.8,-13.6);
// 12 Three inverter-to-motor phase lugs. Tesla service procedures identify
// three phase-terminal fasteners; terminal profile/spacing remains version-specific.
function phaseLugGeometry(w,h,t,r){const sh=new THREE.Shape();sh.moveTo(-w/2,0);sh.lineTo(w/2,0);sh.lineTo(w/2,h-r);sh.quadraticCurveTo(w/2,h,w/2-r,h);sh.lineTo(-w/2+r,h);sh.quadraticCurveTo(-w/2,h,-w/2,h-r);sh.lineTo(-w/2,0);const hole=new THREE.Path();hole.absarc(0,h-r-.42,r,0,Math.PI*2,true);sh.holes.push(hole);return new THREE.ExtrudeGeometry(sh,{depth:t,bevelEnabled:true,bevelSize:.035,bevelThickness:.035,bevelSegments:2,curveSegments:16})}
const ph=part('ph','电机三相端子 ×3','维修手册确认逆变器与电机之间有 3 个相位端子连接点及对应紧固件。端子外形、间距和尺寸仍需按具体 3DU/4DU 实物核实。',[0,0,1],[[.76,1,5]]);
for(const x of[-3.4,1.0,5.4]){
 add(ph,B(1.9,.34,1.65),mIns,x,2.8,9.7);
 const lug=add(ph,phaseLugGeometry(1.18,3.25,.32,.31),mCu,x,2.92,10.15);lug.name='三相铜端子';
 const washer=new THREE.Mesh(new THREE.TorusGeometry(.34,.065,10,24),mNickel);washer.position.set(x,5.75,10.5);washer.userData.part=ph;ph.g.add(washer);
 const bolt=add(ph,Cy(.22,.55,12).rotateX(Math.PI/2),mBolt,x,5.75,10.54);bolt.name='相位端子螺栓';
 add(ph,B(.18,.08,.58),mBk,x,5.75,10.85);
}
// 13 Perimeter seal at the inverter / gearbox mating plane.
const gasket=part('gasket','上盖密封圈','上盖与壳体之间的周边密封圈；外形为参考性建模，不代表原厂截面尺寸。',UP,[[0,.22,1.2],[.22,.55,.8]]);
add(gasket,ring(29.6,21.6,2.0,.42,.22,0),mRub,0,6.13,0);
// 14 Gearbox-interface gasket: Tesla service procedures require a new inverter gasket.
const gearGasket=part('gearGasket','驱动单元接口密封垫','Tesla 维修流程要求逆变器安装时使用新的接口垫片；当前轮廓仅为结构示意，非原厂尺寸。',UP,[[0,.25,1.4],[.25,.55,.9]]);
add(gearGasket,ring(30.4,22.4,2.1,.48,.16,0),mRub,0,-.12,0);
// 15 Two alignment dowels, explicitly documented in 2024+ 3DU/4DU procedures.
const pins=part('pins','装配定位销 ×2','Tesla 2024+ 维修流程记载逆变器与驱动单元通过 2 个定位销对位；此处位置为结构示意。',UP,[[.1,.42,1.5],[.42,.7,1.0]]);
for(const x of[-10.8,10.8]){add(pins,Cy(.22,.72,20),mNickel,x,-.24,0);add(pins,Cy(.31,.10,20),mAlD,x,-.58,0)}
// 15b Gearbox mating fastener locations; the count/pattern is deliberately not tied to one drive-unit revision.
const mount=part('mount','变速箱接口紧固点','用于表示逆变器与驱动单元变速箱之间的周边紧固位置。Tesla 维修资料显示不同 3DU/4DU 版本的螺栓数量并不相同，因此此处仅作位置示意。',UP,[[.12,.48,1.2],[.48,.75,.8]]);
for(const [x,z] of [[-12,-8.7],[-6,-9.8],[0,-9.8],[6,-9.8],[12,-8.7],[-12,8.7],[-6,9.8],[0,9.8],[6,9.8],[12,8.7]]){add(mount,Cy(.34,.18,10),mBolt,x,-.08,z);add(mount,Cy(.22,.22,6),mNickel,x,-.22,z)}
// 15 Coolant fluid couplings / hose interfaces. Internal passages are not guessed.
const cool=part('cool','冷却液流体接头 ×2','维修手册记载逆变器冷却液软管、流体耦合器及排液步骤；接口外观为示意，内部流道未按原厂图纸建模。',[1,0,0],[[.5,.82,3],[.82,1,2]]);
for(const z of[-4.8,4.8]){
 add(cool,B(1.25,1.3,1.35),mAlD,15.0,2.8,z);
 add(cool,Cy(.78,1.0,8).rotateZ(Math.PI/2),mAl,15.85,2.8,z);
 add(cool,Cy(.59,.22,24).rotateZ(Math.PI/2),mRub,16.45,2.8,z);
 add(cool,Cy(.47,1.25,24).rotateZ(Math.PI/2),mAlD,17.0,2.8,z);
 add(cool,Cy(.53,.16,24).rotateZ(Math.PI/2),mBolt,17.38,2.8,z);
 add(cool,Cy(.38,.85,24).rotateZ(Math.PI/2),mRub,17.85,2.8,z);
}
// 16 Logic connector with a visible latch and seal; pin count is illustrative.
const logic=part('logic','低压逻辑连接器','2024+ 维修流程确认逆变器逻辑连接器；壳体、锁扣及针脚数量为视觉示意。',[0,0,-1],[[.55,.84,3],[.84,1,2]]);
add(logic,B(4.8,1.8,2.1),mBk,8.8,4.1,-11.2);add(logic,B(5.2,.22,.32),mRub,8.8,3.45,-12.25);
add(logic,B(3.8,.42,.55),mAlD,8.8,5.15,-11.45);add(logic,B(3.2,.24,.22),mNickel,8.8,5.42,-11.72);
for(let i=0;i<12;i++)add(logic,B(.13,.16,.35),mNickel,7.3+i*.27,4.0,-12.35);
for(const x of[6.55,11.05])add(logic,Cy(.22,.22,16),mBolt,x,3.35,-11.7);
// 17 Discharge-resistor array plus removable pink gap pad (service-visible feature).
const discharge=part('discharge','放电电阻阵列','维修手册明确要求 PCB 上的 gap pad 完整覆盖放电电阻阵列；电阻数量、位置和阻值在此仅作可拆解示意。',UP,[[.42,.72,2.4],[.72,1,2]]);
for(let i=0;i<10;i++){const x=-7.1+i*.37;add(discharge,B(.27,.18,.55),mCer,x,5.66,-.05);add(discharge,B(.06,.09,.62),mNickel,x-.14,5.68,-.05);add(discharge,B(.06,.09,.62),mNickel,x+.14,5.68,-.05)}
const gap=part('gap','粉色绝缘导热垫（Gap Pad）','维修手册要求导热垫完整覆盖放电电阻阵列且不得露出电阻；颜色仅用于识别材料区域，尺寸/位置仍为示意。',UP,[[.4,.68,3.1],[.68,1,2]]);
add(gap,ext(rr(4.45,1.65,.24),.22,.04),mPink,-5.25,5.78,-.05);
// 18 Ground strap attachment point, shown as a reference feature on the housing.
const ground=part('ground','壳体接地固定点','维修资料列有驱动单元接地带；该紧固点和接线片为结构参考，位置待具体版本实物验证。',UP,[[.62,.9,2],[.9,1,1.5]]);
add(ground,Cy(.38,.32,20),mAlD,-14.8,5.6,8.2);add(ground,Cy(.22,.42,16),mNickel,-14.8,5.92,8.2);add(ground,B(2.0,.12,.45),mCu,-13.8,5.93,8.2);add(ground,B(1.0,.12,.18),mCu,-12.9,5.96,8.2);
// Mark edge helpers as belonging to their parent part for stable picking.
parts.forEach(p=>p.g.children.slice().forEach(m=>{if(m.isMesh&&m.geometry.type=='ExtrudeGeometry'){const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,40),edgeMat);l.position.copy(m.position);l.userData.part=p;l.raycast=()=>{};p.g.add(l)}}));
parts.forEach(p=>p.g.userData.base=p.g.position.clone());
// 状态
let ex=0,tgt=0,mode='sel',iso=false,saved=null,sel=null;const rg=$('rg');
const sm=t=>t*t*(3-2*t);
function applyEx(){const p100=ex/100;parts.forEach(p=>{let d=0;p.stages.forEach(([a,b,L])=>d+=L*sm(Math.min(1,Math.max(0,(p100-a)/(b-a)))));p.g.position.copy(p.g.userData.base).addScaledVector(p.dir,d)});$('pc').textContent=Math.round(ex)+'%'}
// 选中/高亮
const hl=new Map(),hm=m=>{let h=hl.get(m);if(!h){h=m.clone();h.emissive=new THREE.Color(0x2a7fff);h.emissiveIntensity=.6;hl.set(m,h)}return h};
function setHL(p,on){p.g.traverse(o=>{if(!o.isMesh)return;if(on){o.userData.o=o.userData.o||o.material;o.material=hm(o.userData.o)}else if(o.userData.o){o.material=o.userData.o;o.userData.o=null}})}
function select(p){if(sel)setHL(sel,false);sel=p;if(p){setHL(p,true);$('in').textContent=p.name;$('id').textContent=p.desc;$('info').style.display='block'}else $('info').style.display='none';drawList()}
function drawList(){const L=$('list');L.innerHTML='';parts.forEach(p=>{const r=document.createElement('div');r.className='row'+(p===sel?' sel':'')+(p.g.visible?'':' off');
const s=document.createElement('span');s.textContent=p.name;s.onclick=()=>select(p===sel?null:p);const b=document.createElement('button');b.textContent=p.g.visible?'👁':'🚫';b.setAttribute('aria-label','显示/隐藏');
b.onclick=()=>{p.g.visible=!p.g.visible;if(!p.g.visible&&sel===p)select(null);drawList()};r.append(s,b);L.append(r)})}
function showAll(){parts.forEach(p=>p.g.visible=true);iso=false;$('bIso').textContent='选中隔离';$('bIso').classList.remove('on');drawList()}
$('bIso').onclick=()=>{if(iso){parts.forEach((p,i)=>p.g.visible=saved[i]);iso=false;$('bIso').textContent='选中隔离';$('bIso').classList.remove('on')}
else if(sel){saved=parts.map(p=>p.g.visible);parts.forEach(p=>p.g.visible=p===sel);iso=true;$('bIso').textContent='取消隔离';$('bIso').classList.add('on')}else{$('stat').textContent='请先点选一个零件';setTimeout(()=>$('stat').textContent='已就绪',1500)}drawList()};
$('bAll').onclick=showAll;
$('bList').onclick=e=>{$('list').classList.toggle('on');e.currentTarget.classList.toggle('on')};
$('bFree').onclick=e=>{mode=mode=='free'?'sel':'free';e.currentTarget.classList.toggle('on',mode=='free');if(mode=='free')select(null);$('stat').textContent=mode=='free'?'自由查看(点击不选中)':'已就绪'};
$('bEx').onclick=()=>{tgt=ex>50?0:100;$('bEx').classList.toggle('on',tgt==100)};
rg.oninput=()=>{ex=tgt=+rg.value;applyEx()};
// 相机
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.minDistance=18;ctl.maxDistance=105;ctl.maxPolarAngle=Math.PI*.98;ctl.screenSpacePanning=true;
const V={F:[0,11,58],S:[58,11,0],T:[0,70,.01],I:[35,29,39],R:[35,29,39]};let tw=null;
function view(k){tw={t:0,f:cam.position.clone(),ft:ctl.target.clone(),to:new THREE.Vector3(...V[k]),tt:new THREE.Vector3(0,3.2,0)};if(k=='R'){tgt=ex=0;rg.value=0;applyEx();$('bEx').classList.remove('on');showAll();select(null)}}
[['vF','F'],['vS','S'],['vT','T'],['vI','I'],['vR','R']].forEach(([i,k])=>$(i).onclick=()=>view(k));
cam.position.set(...V.I);ctl.target.set(0,3.2,0);
// 拾取(区分点按与拖动)
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let dn=null;
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointerup',e=>{if(!dn||mode=='free')return;const mv=Math.hypot(e.clientX-dn.x,e.clientY-dn.y),dt=performance.now()-dn.t;dn=null;if(mv>6||dt>500)return;
const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,cam);
const hit=ray.intersectObjects(root.children.filter(g=>g.visible),true)[0];select(hit?hit.object.userData.part:null)});
function resize(){const w=cv.clientWidth,h=cv.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?58:38;cam.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('WebGL 上下文丢失,请刷新页面')});
let first=true;
renderer.setAnimationLoop(()=>{if(Math.abs(tgt-ex)>.05){ex+=(tgt-ex)*.08;rg.value=ex;applyEx()}
if(tw){tw.t=Math.min(1,tw.t+.04);const s=sm(tw.t);cam.position.lerpVectors(tw.f,tw.to,s);ctl.target.lerpVectors(tw.ft,tw.tt,s);if(tw.t>=1)tw=null}
ctl.update();renderer.render(scene,cam);if(first){first=false;$('ld').style.display='none';$('stat').textContent='已就绪'}});
rg.value=0;ex=tgt=0;applyEx();drawList();window.__mcu={parts,select,view};
}catch(e){fail(e.message||String(e))}
</script></body></html>
