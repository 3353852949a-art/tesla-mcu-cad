<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#10171f">
<title>MCU / CAD · Interactive 3D Assembly</title>
<style>
:root{color-scheme:dark;--bg:#10171f;--panel:#111a23ed;--line:#34424e;--text:#e5edf5;--muted:#8294a5;--mint:#91d1c5}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{overflow:hidden}
header{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid #34404d;background:#0c1117;position:relative;z-index:2}.brand{letter-spacing:.18em;font-weight:700}.mark{border:1px solid #8ebeb8;border-radius:8px;padding:5px;margin-right:8px;color:#9ad5cc}.subtitle{font-size:11px;color:#8295a8}
main{height:calc(100dvh - 58px);min-height:440px;position:relative;background:radial-gradient(ellipse at 50% 42%,#1b2b39,#10171f 68%)}#stage{position:absolute;inset:0}canvas{width:100%;height:100%;display:block;touch-action:none}
.views{position:absolute;top:14px;right:12px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;z-index:3;max-width:85%}
button{background:#17222d;color:#dce8f1;border:1px solid #435260;border-radius:12px;padding:9px 11px;font-size:12px;cursor:pointer;min-height:38px}button:active,button.active{background:#2c4c56;border-color:#91d1c5}
.hint{position:absolute;top:65px;left:12px;font-size:11px;color:#9cabb9;background:#111a23b8;border:1px solid #2a3b48;padding:7px 10px;border-radius:10px;pointer-events:none}
.panel{position:absolute;bottom:12px;left:12px;right:12px;padding:12px;border:1px solid #34424e;border-radius:18px;background:#111a23ed;z-index:3;max-width:680px;margin:auto;backdrop-filter:blur(8px)}
.row{display:flex;align-items:center;gap:10px}.row+.row{margin-top:10px}.label{font-size:12px;min-width:66px}.range{flex:1;min-width:60px;accent-color:#91d1c5}.pct{font-size:12px;min-width:32px;text-align:right;color:#b7dcd5}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:95px}.note{font-size:11px;color:#8294a5;margin-top:8px}.error{position:absolute;top:45%;left:16px;right:16px;text-align:center;color:#c5d4df;background:#111a23d9;padding:12px;border-radius:10px}
@media(min-width:800px){.panel{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 24px))}.views{right:max(12px,calc((100% - 1100px)/2))}header{padding:0 max(14px,calc((100% - 1100px)/2))}}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">M3</span> MCU / CAD</div><div class="subtitle">INTERACTIVE 3D ASSEMBLY</div></header>
<main><div id="stage"><canvas id="cad-canvas"></canvas></div>
<div class="views"><button data-view="iso" class="active">3D</button><button data-view="front">正视</button><button data-view="side">侧视</button><button data-view="top">俯视</button><button data-view="bottom">底视</button></div>
<div class="hint">单指拖动旋转 · 双指缩放 · 滚轮缩放</div>
<div id="cad-error" class="error">正在加载三维模型…</div>
<div class="panel">
 <div class="row"><label class="label" for="cad-explode">爆炸分层</label><input id="cad-explode" class="range" type="range" min="0" max="100" value="18"><span id="cad-pct" class="pct">18%</span></div>
 <div class="row actions"><button id="cad-spin">自动旋转：开</button><button id="cad-reset">重置视角</button><button id="cad-assemble">完整装配</button><button id="cad-explode-btn">爆炸分解</button></div>
 <div class="note">可拖动旋转、缩放；滑动分层条查看内部组件。此为视觉演示模型，并非原厂尺寸工程图。</div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script>
(function(){
const canvas=document.getElementById('cad-canvas'),err=document.getElementById('cad-error'),stage=document.getElementById('stage');
if(!window.THREE){err.textContent='无法加载 Three.js。请检查网络后刷新页面。';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x10171f);scene.fog=new THREE.Fog(0x10171f,18,36);
const camera=new THREE.PerspectiveCamera(38,1,.1,100);
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;
scene.add(new THREE.HemisphereLight(0xdceaff,0x26313b,2.1));
const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(5,9,7);scene.add(key);
const rim=new THREE.DirectionalLight(0x53b9d4,2.1);rim.position.set(-6,3,-6);scene.add(rim);
const mat=(c,metal=.25,rough=.35)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough});
const aluminum=mat(0x9aa9b7,.82,.24),bright=mat(0xdce4eb,.8,.2),graphite=mat(0x202a34,.55,.3),black=mat(0x10161d,.3,.32),green=mat(0x165346,.25,.4),green2=mat(0x267c68,.25,.35),gold=mat(0xc4a15d,.78,.22),copper=mat(0xb27c43,.75,.26),blue=mat(0x326b89,.45,.3);
const assembly=new THREE.Group();scene.add(assembly);const layers=[];
function layer(y){const g=new THREE.Group();g.position.y=y;assembly.add(g);layers.push({g,y});return g}
function box(g,w,h,d,m,x,y,z){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);g.add(o);return o}
function cylinder(g,r,h,m,x,y,z){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,24),m);o.position.set(x,y,z);g.add(o);return o}
const base=layer(-1.12);
box(base,5.5,.4,3.55,blue,0,0,0);box(base,5.24,.16,3.3,graphite,0,.24,0);box(base,4.98,.1,3.08,aluminum,0,.34,0);
for(let i=0;i<22;i++)box(base,.055,.17,.24,gold,-1.65+i*.157,.02,1.82);
box(base,3.85,.17,.27,black,0,.02,1.8);
for(const x of [-2.35,2.35])for(const z of [-1.35,1.35])cylinder(base,.12,.12,bright,x,.45,z);
const shield=layer(-.57);
box(shield,5.15,.16,3.23,graphite,0,0,0);box(shield,4.98,.07,3.06,bright,0,.11,0);
for(const x of [-2.3,2.3])for(const z of [-1.3,1.3])cylinder(shield,.13,.08,graphite,x,.17,z);
const pcbLayer=layer(.03);
box(pcbLayer,4.85,.15,2.94,green,0,0,0);box(pcbLayer,4.55,.025,2.7,green2,0,.087,0);
for(let i=0;i<14;i++)box(pcbLayer,.018,.014,1.9,copper,-1.9+i*.29,.108,0);
for(let i=0;i<9;i++)box(pcbLayer,2.4,.014,.018,copper,0,.11,-1.1+i*.27);
for(let i=0;i<6;i++)for(let j=0;j<4;j++)cylinder(pcbLayer,.035,.025,gold,-2.05+i*.78,.12,-1.12+j*.72);
const chips=[[-1.68,-.72,.65,.53],[-1.68,.62,.65,.53],[1.38,-.72,.72,.58],[1.38,.02,.72,.58],[1.38,.75,.72,.48],[-.1,1.02,.55,.34]];
for(const [x,z,w,d] of chips){box(pcbLayer,w,.19,d,black,x,.22,z);box(pcbLayer,w*.82,.055,d*.78,graphite,x,.34,z);for(let i=0;i<5;i++){box(pcbLayer,.055,.035,.05,bright,x-w*.31+i*w*.155,.39,z-d*.23);box(pcbLayer,.055,.035,.05,bright,x-w*.31+i*w*.155,.39,z+d*.23)}for(let i=0;i<4;i++){box(pcbLayer,.045,.035,.05,gold,x-w*.42,.28,z-d*.25+i*d*.16);box(pcbLayer,.045,.035,.05,gold,x+w*.42,.28,z-d*.25+i*d*.16)}}
box(pcbLayer,1.2,.2,1.05,black,.05,.27,-.02);box(pcbLayer,1.08,.055,.93,graphite,.05,.39,-.02);
for(let i=0;i<18;i++){const p=-.44+i*.057;box(pcbLayer,.026,.07,.08,gold,p,.36,-.57);box(pcbLayer,.026,.07,.08,gold,p,.36,.53)}
for(let i=0;i<15;i++)box(pcbLayer,.12,.11,.065,bright,2.3,.18,-1.25+i*.175);
const thermal=layer(.66);box(thermal,4.98,.14,3.12,copper,0,0,0);box(thermal,5.12,.12,3.24,graphite,0,.1,0);
const lid=layer(1.2);box(lid,5.4,.22,3.52,aluminum,0,0,0);box(lid,5.05,.07,3.18,bright,0,.15,0);box(lid,4.82,.06,2.95,graphite,0,.21,0);
for(let i=0;i<15;i++){const x=-2.2+i*.315;box(lid,.105,.34,2.55,bright,x,.39,0);box(lid,.14,.055,2.58,aluminum,x,.57,0)}
for(const x of [-2.48,2.48])for(const z of [-1.5,1.5]){cylinder(lid,.105,.07,graphite,x,.18,z);cylinder(lid,.062,.08,bright,x,.23,z)}
const grid=new THREE.GridHelper(18,36,0x334654,0x243441);grid.position.y=-1.72;scene.add(grid);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),mat(0x10171f,.05,.9));floor.rotation.x=-Math.PI/2;floor.position.y=-1.74;scene.add(floor);
let radius=11.7,az=.68,pol=1.04,auto=true,drag=false,lastX=0,lastY=0,pointers=new Map(),lastPinch=0;
function place(){pol=Math.max(.12,Math.min(Math.PI-.12,pol));radius=Math.max(5,Math.min(24,radius));camera.position.set(radius*Math.sin(pol)*Math.sin(az),radius*Math.cos(pol),radius*Math.sin(pol)*Math.cos(az));camera.lookAt(0,0,0)}
function setExplode(v){document.getElementById('cad-pct').textContent=v+'%';const gap=v*.008;layers.forEach((l,i)=>l.g.position.y=l.y+(i-2.5)*gap)}
function resize(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
resize();place();setExplode(18);err.style.display='none';
canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);if(pointers.size===1){drag=true;lastX=e.clientX;lastY=e.clientY}else if(pointers.size===2){const a=[...pointers.values()];lastPinch=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);drag=false}});
canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1&&drag){az-=(e.clientX-lastX)*.008;pol-=(e.clientY-lastY)*.008;lastX=e.clientX;lastY=e.clientY;place()}else if(pointers.size===2){const a=[...pointers.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);if(lastPinch)radius*=lastPinch/d;lastPinch=d;place()}});
function pointerEnd(e){pointers.delete(e.pointerId);drag=false;lastPinch=0}canvas.addEventListener('pointerup',pointerEnd);canvas.addEventListener('pointercancel',pointerEnd);
canvas.addEventListener('wheel',e=>{radius*=e.deltaY>0?1.08:.92;place()},{passive:true});
document.getElementById('cad-explode').addEventListener('input',e=>setExplode(+e.target.value));
document.getElementById('cad-spin').onclick=e=>{auto=!auto;e.target.textContent='自动旋转：'+(auto?'开':'关');e.target.classList.toggle('active',!auto)};
document.getElementById('cad-reset').onclick=()=>{radius=11.7;az=.68;pol=1.04;document.getElementById('cad-explode').value=18;setExplode(18);place()};
document.getElementById('cad-assemble').onclick=()=>{document.getElementById('cad-explode').value=0;setExplode(0)};
document.getElementById('cad-explode-btn').onclick=()=>{document.getElementById('cad-explode').value=70;setExplode(70)};
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');radius=11.7;const v=b.dataset.view;if(v==='front'){az=0;pol=Math.PI/2}else if(v==='side'){az=Math.PI/2;pol=Math.PI/2}else if(v==='top'){az=0;pol=.12}else if(v==='bottom'){az=0;pol=Math.PI-.12}else{az=.68;pol=1.04}place()});
if(window.ResizeObserver)new ResizeObserver(resize).observe(stage);else window.addEventListener('resize',resize);
function tick(){requestAnimationFrame(tick);if(auto&&!drag)assembly.rotation.y+=.0022;renderer.render(scene,camera)}tick();
})();
</script>
</body>
</html>
