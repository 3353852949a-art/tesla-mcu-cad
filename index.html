<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080c11">
<title>MCU 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080c11}#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}.error{position:fixed;inset:0;display:none;place-items:center;background:#080c11;color:#d7e0e8;font:14px system-ui,sans-serif;text-align:center;padding:24px}.error.show{display:grid}
</style>
</head>
<body>
<canvas id="view"></canvas><div id="error" class="error"></div>
<script>
setTimeout(()=>{if(!window.__mcuReady){const e=document.getElementById('error');e.textContent='3D 模型加载失败，请检查网络后重新打开。';e.classList.add('show')}},15000);
</script>
<script type="module">
(async()=>{
 const sources=[
  {three:'https://unpkg.com/three@0.160.0/build/three.module.js',orbit:'https://unpkg.com/three@0.160.0/examples/jsm/controls/OrbitControls.js'},
  {three:'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js',orbit:'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'}
 ];
 let THREE,OrbitControls,last;
 for(const s of sources){try{THREE=await import(s.three);({OrbitControls}=await import(s.orbit));break}catch(e){last=e}}
 if(!THREE||!OrbitControls)throw last||new Error('3D engine unavailable');
 const canvas=document.querySelector('#view');
 const scene=new THREE.Scene();scene.background=new THREE.Color('#080c11');
 const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,100);camera.position.set(7.6,6.2,8.7);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 const controls=new OrbitControls(camera,canvas);controls.enableDamping=true;controls.dampingFactor=.065;controls.minDistance=4.5;controls.maxDistance=20;controls.target.set(0,0,0);
 scene.add(new THREE.HemisphereLight(0xdcecff,0x202934,2.1));
 const key=new THREE.DirectionalLight(0xffffff,3.2);key.position.set(6,10,8);scene.add(key);
 const rim=new THREE.DirectionalLight(0x69bfae,2.5);rim.position.set(-7,4,-6);scene.add(rim);
 const fill=new THREE.DirectionalLight(0x809bd1,1.25);fill.position.set(0,-3,7);scene.add(fill);
 const root=new THREE.Group();scene.add(root);
 const material=(color,metalness=.2,roughness=.35)=>new THREE.MeshStandardMaterial({color,metalness,roughness});
 const m={al:material('#9aa6ad',.86,.27),dark:material('#202a32',.55,.3),black:material('#11171d',.28,.32),pcb:material('#17604b',.25,.38),green:material('#26765b',.2,.42),gold:material('#d3ad68',.82,.22),copper:material('#bc7444',.8,.25),silver:material('#c8d0d5',.9,.19),ceramic:material('#dce0d9',.12,.25),blue:material('#426e88',.55,.29),rubber:material('#141a1e',.05,.78)};
 function add(geo,mat,pos,rot=[0,0,0],parent=root){const o=new THREE.Mesh(geo,mat);o.position.set(...pos);o.rotation.set(...rot);parent.add(o);return o}
 function box(size,mat,pos,rot){return add(new THREE.BoxGeometry(...size),mat,pos,rot)}
 function cyl(r1,r2,h,mat,pos,rot=[0,0,0],n=24){return add(new THREE.CylinderGeometry(r1,r2,h,n),mat,pos,rot)}
 function plate(w,d,h,r,mat,y){
  const s=new THREE.Shape();s.moveTo(-w/2+r,-d/2);s.lineTo(w/2-r,-d/2);s.quadraticCurveTo(w/2,-d/2,w/2,-d/2+r);s.lineTo(w/2,d/2-r);s.quadraticCurveTo(w/2,d/2,w/2-r,d/2);s.lineTo(-w/2+r,d/2);s.quadraticCurveTo(-w/2,d/2,-w/2,d/2-r);s.lineTo(-w/2,-d/2+r);s.quadraticCurveTo(-w/2,-d/2,-w/2+r,-d/2);const g=new THREE.ExtrudeGeometry(s,{depth:h,bevelEnabled:true,bevelSegments:3,steps:1,bevelSize:.035,bevelThickness:.025,curveSegments:6});g.rotateX(-Math.PI/2);return add(g,mat,[0,y,0]);
 }
 // Aluminium base and side rails
 plate(5.7,3.65,.36,.28,m.al,-.02);
 plate(5.35,3.3,.12,.23,m.dark,-.25);
 for(const x of [-2.25,-1.5,-.75,0,.75,1.5,2.25])box([.1,.12,2.8],m.al,[x,.18,0]);
 // PCB and copper traces
 plate(4.55,2.55,.12,.12,m.pcb,.16);
 for(let i=0;i<13;i++){const x=-1.95+i*.325;box([.035,.012,1.95],m.copper,[x,.232,0]);}
 for(let i=0;i<7;i++){const z=-.9+i*.3;box([3.8,.012,.025],m.copper,[0,.235,z]);}
 // Central processor package
 box([1.38,.2,1.18],m.dark,[0,.34,0]);
 box([1.12,.1,.94],m.black,[0,.49,0]);
 box([.88,.035,.7],m.silver,[0,.56,0]);
 box([.74,.04,.56],m.dark,[0,.6,0]);
 // Power modules, heatsink caps and driver ICs
 for(let i=0;i<6;i++){const x=-1.55+(i%3)*1.55,z=i<3?-.7:.7;box([.72,.28,.58],m.dark,[x,.38,z]);box([.56,.08,.43],m.black,[x,.56,z]);for(let k=0;k<4;k++)box([.075,.025,.34],m.silver,[x-.19+k*.125,.615,z]);}
 for(let i=0;i<4;i++){const x=-1.35+i*.9; cyl(.25,.25,.48,m.dark,[x,.43,-1.03],[0,0,0],32);cyl(.215,.215,.035,m.silver,[x,.69,-1.03],[0,0,0],32);cyl(.075,.075,.025,m.gold,[x,.715,-1.03],[0,0,0],20);}
 for(let i=0;i<8;i++){const x=-1.72+(i%4)*1.15,z=i<4?-.92:.92;box([.36,.1,.23],m.black,[x,.32,z]);box([.28,.035,.15],m.gold,[x,.39,z]);}
 // Bus bars
 for(let i=0;i<3;i++){const z=-.38+i*.38;box([3.65,.09,.13],m.copper,[0,.57,z]);for(const x of [-1.45,0,1.45])cyl(.065,.065,.025,m.gold,[x,.625,z],[0,0,0],16);}
 // High and low voltage connectors
 for(let i=0;i<3;i++){const z=-.72+i*.72;box([.6,.46,.45],m.black,[2.45,.14,z]);box([.34,.25,.31],m.gold,[2.78,.16,z]);for(let k=0;k<4;k++)cyl(.045,.045,.13,m.silver,[2.97,.16,z-.12+k*.08],[0,0,Math.PI/2],12);}
 box([.5,.36,.32],m.dark,[-2.42,.12,.95]);for(let k=0;k<8;k++)cyl(.032,.032,.12,m.gold,[-2.7,.13,.72+k*.065],[0,0,Math.PI/2],12);
 // Upper lid lifted just enough to show its machined shape
 plate(5.52,3.48,.16,.28,m.al,.98);
 plate(4.9,2.9,.025,.22,m.rubber,.89);
 for(const x of [-2.25,-1.15,0,1.15,2.25])for(const z of [-1.3,1.3])cyl(.07,.07,.05,m.silver,[x,1.075,z],[0,0,0],16);
 // Perimeter fasteners
 for(const x of [-2.55,-1.28,0,1.28,2.55])for(const z of [-1.5,1.5]){cyl(.085,.085,.1,m.silver,[x,.24,z],[0,0,0],8);cyl(.035,.035,.105,m.dark,[x,.3,z],[0,0,0],6);}
 // Compact cooling ribs across the side
 for(let i=0;i<9;i++)box([.035,.12,2.7],m.dark,[-2.84,.05,-1.25+i*.31]);
 function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
 addEventListener('resize',resize,{passive:true});resize();
 window.__mcuReady=true;
 function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();
})().catch(err=>{console.error(err);const e=document.querySelector('#error');e.textContent='此裝置無法載入 3D 模型，請確認網路或瀏覽器支援 WebGL。';e.classList.add('show')});
</script>
</body>
</html>
