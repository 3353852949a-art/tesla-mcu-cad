<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0a1017">
<title>MCU 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d13;overscroll-behavior:none}body{background:radial-gradient(ellipse at 50% 38%,#253947 0,#121e29 48%,#080d13 100%);touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}.controls{position:fixed;z-index:2;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:12px}.controls button{width:48px;height:48px;border-radius:50%;border:1px solid #536b78;background:#101a24e8;color:#dce9ee;font:22px/1 system-ui,sans-serif;box-shadow:0 6px 24px #0007;touch-action:manipulation}.controls button.active{border-color:#6ee7c8;color:#8ef4d9;background:#15372f}.fallback{position:fixed;inset:0;display:none;place-items:center;color:#c6d5dc;font:14px system-ui,sans-serif;text-align:center;padding:28px}.fallback.show{display:grid}
</style></head>
<body>
<canvas id="view" aria-label="Interactive 3D MCU"></canvas>
<div class="controls"><button id="explode" class="active" aria-label="Exploded view">⤢</button><button id="wire" aria-label="Wireframe">▦</button><button id="reset" aria-label="Reset view">↺</button></div>
<div class="fallback" id="fallback">此浏览器无法绘制模型，请用系统浏览器打开。</div>
<script>
(function(){
'use strict';
var canvas=document.getElementById('view'),ctx=canvas.getContext&&canvas.getContext('2d'),fallback=document.getElementById('fallback');
if(!ctx){fallback.classList.add('show');return;}
var yaw=-.62,pitch=.52,zoom=1,exploded=true,wire=false,pts={},last=null,pinch=0,startZoom=zoom,dpr=1,w=1,h=1;
var C={al:'#8c9ca4',silver:'#c9d3d7',dark:'#202b34',rubber:'#11171c',pcb:'#087149',green:'#16845b',gold:'#c7953e',copper:'#a9572c',chip:'#263740',chipTop:'#65747a',ceramic:'#bdbdaf',blue:'#2e5065'};
var objects=[];
function add(x,y,z,sx,sy,sz,color,group){objects.push({p:[x,y,z],s:[sx,sy,sz],c:color,g:group||'fixed'});}
add(0,-.42,0,5.7,.38,3.65,C.al,'base');add(0,-.22,0,5.35,.12,3.3,C.dark,'base');
for(var i=0;i<13;i++)add(-2.45+i*.408,-.19,0,.075,.035,2.85,C.silver,'base');
for(i=0;i<8;i++)add(-2.84,-.39,-1.35+i*.385,.12,.17,.045,C.dark,'base');
add(0,-.015,0,4.55,.12,2.55,C.pcb,'board');
for(i=0;i<13;i++)add(-1.95+i*.325,.052,0,.026,.009,1.95,C.copper,'board');
for(i=0;i<7;i++)add(0,.055,-.9+i*.3,3.8,.009,.022,C.copper,'board');
for(i=0;i<4;i++)for(var j=0;j<2;j++)add(-2.05+i*1.36,.061,-1.05+j*2.1,.12,.015,.12,C.gold,'board');
add(0,.16,0,1.5,.22,1.28,C.dark,'compute');add(0,.29,0,1.23,.09,1.02,C.chip,'compute');add(0,.345,0,.98,.045,.79,C.silver,'compute');add(0,.375,0,.82,.035,.63,C.chip,'compute');
for(i=0;i<6;i++){var x=-1.55+(i%3)*1.55,z=i<3?-.7:.7;add(x,.14,z,.72,.25,.58,C.dark,'power');add(x,.29,z,.56,.06,.43,C.chipTop,'power');for(var k=0;k<4;k++)add(x-.19+k*.125,.335,z,.065,.025,.34,C.silver,'power');}
for(i=0;i<4;i++){x=-1.35+i*.9;add(x,.18,-1.03,.46,.42,.46,C.dark,'power');add(x,.405,-1.03,.39,.035,.39,C.silver,'power');add(x,.428,-1.03,.13,.02,.13,C.gold,'power');}
for(i=0;i<8;i++){x=-1.72+(i%4)*1.15;z=i<4?-.92:.92;add(x,.11,z,.36,.1,.23,C.chip,'power');add(x,.18,z,.28,.035,.15,C.gold,'power');}
for(i=0;i<3;i++){z=-.72+i*.72;add(2.45,-.12,z,.6,.46,.45,C.dark,'connectors');add(2.79,-.1,z,.3,.27,.32,C.gold,'connectors');for(k=0;k<4;k++)add(2.98,-.1,z-.12+k*.08,.13,.065,.045,C.silver,'connectors');}
add(-2.42,-.12,.95,.5,.36,.32,C.dark,'connectors');for(i=0;i<8;i++)add(-2.7,-.12,.72+i*.065,.13,.06,.032,C.gold,'connectors');
add(0,1.05,0,5.52,.16,3.48,C.al,'lid');add(0,.91,0,4.9,.025,2.9,C.rubber,'seal');
for(i=0;i<5;i++)for(j=0;j<2;j++)add(-2.25+i*1.125,1.145,j?1.35:-1.35,.14,.055,.14,C.silver,'lid');
var faces=[
 {v:[0,1,3,2],n:[0,0,1],b:1.0},{v:[5,4,6,7],n:[0,0,-1],b:.56},
 {v:[4,0,2,6],n:[-1,0,0],b:.68},{v:[1,5,7,3],n:[1,0,0],b:.78},
 {v:[2,3,7,6],n:[0,1,0],b:1.12},{v:[4,5,1,0],n:[0,-1,0],b:.48}
];
function rotate(v){var cy=Math.cos(yaw),sy=Math.sin(yaw),cx=Math.cos(pitch),sx=Math.sin(pitch);var xx=v[0]*cy+v[2]*sy,zz=-v[0]*sy+v[2]*cy;return [xx,v[1]*cx-zz*sx,v[1]*sx+zz*cx];}
function shade(hex,f){var n=parseInt(hex.slice(1),16),r=Math.min(255,Math.round(((n>>16)&255)*f)),g=Math.min(255,Math.round(((n>>8)&255)*f)),b=Math.min(255,Math.round((n&255)*f));return 'rgb('+r+','+g+','+b+')';}
function resize(){dpr=Math.min(window.devicePixelRatio||1,1.5);w=Math.max(1,Math.floor(innerWidth*dpr));h=Math.max(1,Math.floor(innerHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}canvas.style.width=innerWidth+'px';canvas.style.height=innerHeight+'px';ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function draw(){
 var W=innerWidth,H=innerHeight;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
 var scale=Math.min(W/8.8,H/9.7)*zoom, focal=Math.min(W,H)*1.8;
 var all=[];
 objects.forEach(function(o){
  var dy=0;if(exploded){if(o.g==='lid')dy=1.15;else if(o.g==='seal')dy=.72;else if(o.g==='compute')dy=.38;else if(o.g==='power')dy=.25;else if(o.g==='connectors')dy=.18;else if(o.g==='board')dy=.08;else if(o.g==='base')dy=-.3;}
  var sx=o.s[0]/2,sy=o.s[1]/2,sz=o.s[2]/2,cx=o.p[0],cy=o.p[1]+dy,cz=o.p[2];
  var raw=[[-sx,-sy,-sz],[sx,-sy,-sz],[-sx,sy,-sz],[sx,sy,-sz],[-sx,-sy,sz],[sx,-sy,sz],[-sx,sy,sz],[sx,sy,sz]];
  var v=raw.map(function(q){var r=rotate([q[0]+cx,q[1]+cy,q[2]+cz]);return {x:W/2+r[0]*focal/(focal/scale+r[2]*scale),y:H*.46-r[1]*focal/(focal/scale+r[2]*scale),z:r[2]};});
  faces.forEach(function(f){var av=f.v.reduce(function(a,id){return a+v[id].z;},0)/4;all.push({v:f.v.map(function(id){return v[id];}),z:av,c:o.c,b:f.b});});
 });
 all.sort(function(a,b){return a.z-b.z;});
 all.forEach(function(f){ctx.beginPath();ctx.moveTo(f.v[0].x,f.v[0].y);for(var i=1;i<f.v.length;i++)ctx.lineTo(f.v[i].x,f.v[i].y);ctx.closePath();if(wire){ctx.strokeStyle='#8ef4d9';ctx.lineWidth=1;ctx.stroke();}else{ctx.fillStyle=shade(f.c,f.b);ctx.fill();ctx.strokeStyle='#07101755';ctx.lineWidth=.65;ctx.stroke();}});
}
function dist(){var a=Object.keys(pts).map(function(k){return pts[k];});return a.length<2?0:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);}
canvas.addEventListener('pointerdown',function(e){try{canvas.setPointerCapture(e.pointerId);}catch(_){}pts[e.pointerId]={x:e.clientX,y:e.clientY};last={x:e.clientX,y:e.clientY};if(Object.keys(pts).length===2){pinch=dist();startZoom=zoom;}});
canvas.addEventListener('pointermove',function(e){if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};if(Object.keys(pts).length>1){var d=dist();if(pinch>0)zoom=Math.max(.55,Math.min(1.6,startZoom*d/pinch));}else if(last){yaw+=(e.clientX-last.x)*.009;pitch=Math.max(-1.05,Math.min(1.15,pitch+(e.clientY-last.y)*.008));}last={x:e.clientX,y:e.clientY};draw();});
function end(e){delete pts[e.pointerId];if(Object.keys(pts).length<2)pinch=0;last=null;}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
canvas.addEventListener('wheel',function(e){e.preventDefault();zoom=Math.max(.55,Math.min(1.6,zoom-e.deltaY*.001));draw();},{passive:false});
document.getElementById('explode').addEventListener('click',function(){exploded=!exploded;this.classList.toggle('active',exploded);draw();});
document.getElementById('wire').addEventListener('click',function(){wire=!wire;this.classList.toggle('active',wire);draw();});
document.getElementById('reset').addEventListener('click',function(){yaw=-.62;pitch=.52;zoom=1;exploded=true;wire=false;document.getElementById('explode').classList.add('active');document.getElementById('wire').classList.remove('active');draw();});
window.addEventListener('resize',resize);resize();
})();
</script></body></html>
