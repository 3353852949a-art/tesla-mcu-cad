 add(electronics,B(w,.20,d),mChip,x,.34,z,'功率/控制封装');
 add(electronics,B(w*.78,.055,d*.76),mBk,x,.465,z,'封装顶面');
 for(let k=0;k<4;k++){
  const xx=x-w*.32+k*w*.213;
  add(electronics,B(.07,.05,.13),mNickel,xx,.43,z-d*.44,'器件焊端');

 }
}
// Small passive banks in regular rows, not random blocks.
for(let row=0;row<4;row++)for(let col=0;col<20;col++){
 const x=-10.6+col*1.1,z=-3.65+row*.86;
 add(electronics,B(.30,.10,.18),mChip,x,.34,z,'贴片电阻/电容');
 add(electronics,B(.055,.07,.20),mNickel,x-.18,.36,z,'贴片焊端');
 add(electronics,B(.055,.07,.20),mNickel,x+.18,.36,z,'贴片焊端');

// Small metal can capacitors grouped at a board corner as seen in the reference image.
for(let i=0;i<4;i++){
 const x=8.2+(i%2)*1.0,z=0.3+Math.floor(i/2)*1.2;
 add(electronics,Cy(.34,.52,24),mSil,x,.58,z,'小型金属电容');
 add(electronics,Cy(.22,.045,20),mNickel,x,.85,z,'电容顶盖');
}
// 6. Discharge resistor array (visible when the thermal gap pad is exploded away).
const discharge=part('discharge','放电电阻阵列','Tesla 2024+ 3DU 维修步骤明确要求检查放电电阻阵列，并确认 Gap Pad 完整覆盖电阻、不得露出。阵列外观和单体数量为示意。',UP,[[.4,.68,1.25],[.68,.9,.7]]);
for(let i=0;i<8;i++){
 const x=-2.8+i*.8;
 add(discharge,B(.54,.18,.68),mCer,x,.50,-.15,'放电电阻');
 add(discharge,B(.12,.10,.72),mNickel,x-.25,.54,-.15,'电阻端帽');
 add(discharge,B(.12,.10,.72),mNickel,x+.25,.54,-.15,'电阻端帽');
}
// 7. Pink thermal interface gap pad placed over the resistor array.
const gap=part('gap','粉色绝缘导热垫（Gap Pad）','官方维修手册要求 Gap Pad 完整覆盖放电电阻阵列、不得露出电阻，并保持清洁、平整粘附。此处以独立零件表示，便于拆解观察。',UP,[[.25,.52,1.5],[.52,.78,.8]]);
add(gap,ext(rr(7.35,1.35,.20),.12,.025),mPink,-.05,.78,-.15,'Gap Pad');

// 8. Three inverter-to-motor phase lugs and their three fasteners.
function phaseTabGeometry(){
 const sh=new THREE.Shape();sh.moveTo(-.57,0);sh.lineTo(.57,0);sh.lineTo(.57,2.50);sh.quadraticCurveTo(.57,3.08,.12,3.20);sh.lineTo(-.12,3.20);sh.quadraticCurveTo(-.57,3.08,-.57,2.50);sh.closePath();
 const hole=new THREE.Path();hole.absarc(0,2.64,.22,0,Math.PI*2,true);sh.holes.push(hole);
 return new THREE.ExtrudeGeometry(sh,{depth:.22,bevelEnabled:true,bevelSize:.035,bevelThickness:.035,bevelSegments:3,curveSegments:20});
}
const phase=part('phase','电机三相铜端子 ×3','Tesla 2024+ 3DU 流程确认逆变器与电机三相端子有 3 个独立螺栓连接点。官方拆解照片可见三片竖直铜色端子；形状和中心距按照片估算。',[0,0,-1],[[.55,.82,1.5],[.82,1,1.0]]);
for(let i=0;i<3;i++){
 const x=-3.0+i*3.0;
 add(phase,B(1.35,.20,.68),mBk,x,.32,-8.42,'相位端子绝缘底座');
 add(phase,phaseTabGeometry(),mCu,x,.40,-8.86,'竖直铜相位端子');
 add(phase,new THREE.TorusGeometry(.245,.055,10,24),mNickel,x,3.02,-8.61,'相位端子垫圈');
 add(phase,Cy(.16,.42,16).rotateX(Math.PI/2),mBolt,x,3.02,-8.57,'相位连接螺栓');
}

// 9. Coolant connection area. The service procedure confirms an inverter inlet tube
// and an inverter-to-cooler hose; exact port form/spacing is not dimensioned here.
const cool=part('cool','冷却液管路接口区','2024+ 3DU 维修流程记录逆变器 inlet tube、inverter-to-cooler hose、fluid coupling 及堵头拆装；本模型仅表示接口区域，不臆造内部冷却流道和精确接头尺寸。',[1,0,0],[[.52,.82,1.6],[.82,1,1.0]]);
for(const z of[-4.1,4.1]){
 add(cool,B(1.0,.82,1.35),mAlD,13.65,.05,z,'冷却接口铸造座');
 add(cool,Cy(.58,.92,24).rotateZ(Math.PI/2),mAl,14.30,.10,z,'冷却液接头');
 add(cool,Cy(.43,.18,24).rotateZ(Math.PI/2),mRub,14.80,.10,z,'接头密封圈');
 add(cool,Cy(.34,.50,24).rotateZ(Math.PI/2),mBk,15.10,.10,z,'管路连接端');
}

// 10. Separate removable top cover; a relief notch leaves the three phase tabs exposed.
function coverOutline(){const s=new THREE.Shape();s.moveTo(-12.9,-10.15);s.lineTo(12.9,-10.15);s.quadraticCurveTo(14.2,-10.15,14.2,-8.8);s.lineTo(14.2,8.8);s.quadraticCurveTo(14.2,10.0,12.9,10.0);s.lineTo(5.3,10.0);s.lineTo(5.3,7.55);s.lineTo(-5.3,7.55);s.lineTo(-5.3,10.0);s.lineTo(-12.9,10.0);s.quadraticCurveTo(-14.2,10.0,-14.2,8.8);s.lineTo(-14.2,-8.8);s.quadraticCurveTo(-14.2,-10.15,-12.9,-10.15);s.closePath();return s}
const cover=part('cover','铸铝上盖','展示用可拆上盖，用来表现 PCBA 在铸铝壳体内的保护关系。官方维修流程可确认逆变器壳体和 PCBA，但未在该步骤中给出上盖的外形尺寸及内部加强筋细节。',UP,[[.04,.44,5.0],[.44,.72,1.3]]);
add(cover,ext(coverOutline(),.58,.11),mAl,0,1.02,0,'铸铝上盖外壳');
add(cover,ext(rr(25.9,15.8,1.25),.12,.045),mAlD,0,.94,.8,'上盖内侧加强面');
for(let i=0;i<7;i++)add(cover,B(.42,.22,13.4),mAlD,-10.8+i*3.6,.86,0,'上盖内侧加强筋');
// No unverified DC-link capacitor bank, three discrete power modules or invented
// internal liquid channels are included in this 3DU reference build.

// Mark edge helpers as belonging to their parent part for stable picking.
parts.forEach(p=>p.g.children.slice().forEach(m=>{if(m.isMesh&&m.geometry.type=='ExtrudeGeometry'){const l=new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry,40),edgeMat);l.position.copy(m.position);l.userData.part=p;l.raycast=()=>{};p.g.add(l)}}));
parts.forEach(p=>p.g.userData.base=p.g.position.clone());
// 状态
let ex=0,tgt=0,mode='sel',iso=false,saved=null,sel=null;const rg=$('rg');
const sm=t=>t*t*(3-2*t);
function applyEx(){const p100=ex/100;parts.forEach(p=>{let d=0;p.stages.forEach(([a,b,L])=>d+=L*sm(Math.min(1,Math.max(0,(p100-a)/(b-a)))));p.g.position.copy(p.g.userData.base).addScaledVector(p.dir,d)});$('pc').textContent=Math.round(ex)+'%'}
// 选中/高亮
const hl=new Map(),hm=m=>{let h=hl.get(m);if(!h){h=m.clone();h.emissive=new THREE.Color(0x2a7fff);h.emissiveIntensity=.6;hl.set(m,h)}return h};
function setHL(p,on){p.g.traverse(o=>{if(!o.isMesh)return;if(on){o.userData.o=o.userData.o||o.material;o.material=hm(o.userData.o)}else if(o.userData.o){o.material=o.userData.o;o.userData.o=null}})}
function select(p){if(sel)setHL(sel,false);sel=p;if(p){setHL(p,true);$('in').textContent=p.name;$('id').textContent=p.desc;$('info').style.display='block'}else $('info').style.display='none';drawList()}
function drawList(){const L=$('list');L.innerHTML='';parts.forEach(p=>{const r=document.createElement('div');r.className='row'+(p===sel?' sel':'')+(p.g.visible?'':' off');
const s=document.createElement('span');s.textContent=p.name;s.onclick=()=>select(p===sel?null:p);const b=document.createElement('button');b.textContent=p.g.visible?'👁':'🚫';b.setAttribute('aria-label','显示/隐藏');
b.onclick=()=>{p.g.visible=!p.g.visible;if(!p.g.visible&&sel===p)select(null);drawList()};r.append(s,b);L.append(r)})}
function showAll(){parts.forEach(p=>p.g.visible=true);iso=false;$('bIso').textContent='选中隔离';$('bIso').classList.remove('on');drawList()}
$('bIso').onclick=()=>{if(iso){parts.forEach((p,i)=>p.g.visible=saved[i]);iso=false;$('bIso').textContent='选中隔离';$('bIso').classList.remove('on')}
else if(sel){saved=parts.map(p=>p.g.visible);parts.forEach(p=>p.g.visible=p===sel);iso=true;$('bIso').textContent='取消隔离';$('bIso').classList.add('on')}else{$('stat').textContent='请先点选一个零件';setTimeout(()=>$('stat').textContent='已就绪',1500)}drawList()};
$('bAll').onclick=showAll;
$('bList').onclick=e=>{$('list').classList.toggle('on');e.currentTarget.classList.toggle('on')};
$('bFree').onclick=e=>{mode=mode=='free'?'sel':'free';e.currentTarget.classList.toggle('on',mode=='free');if(mode=='free')select(null);$('stat').textContent=mode=='free'?'自由查看(点击不选中)':'已就绪'};
$('bEx').onclick=()=>{tgt=ex>50?0:100;$('bEx').classList.toggle('on',tgt==100)};
rg.oninput=()=>{ex=tgt=+rg.value;applyEx()};
// 相机
const ctl=new THREE.OrbitControls(cam,cv);ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.minDistance=18;ctl.maxDistance=105;ctl.maxPolarAngle=Math.PI*.98;ctl.screenSpacePanning=true;
const V={F:[0,9,48],S:[48,9,0],T:[0,59,.01],I:[31,25,34],R:[31,25,34]};let tw=null;
function view(k){tw={t:0,f:cam.position.clone(),ft:ctl.target.clone(),to:new THREE.Vector3(...V[k]),tt:new THREE.Vector3(0,.1,0)};if(k=='R'){tgt=ex=0;rg.value=0;applyEx();$('bEx').classList.remove('on');showAll();select(null)}}
[['vF','F'],['vS','S'],['vT','T'],['vI','I'],['vR','R']].forEach(([i,k])=>$(i).onclick=()=>view(k));
cam.position.set(...V.I);ctl.target.set(0,.1,0);
// 拾取(区分点按与拖动)
const ray=new THREE.Raycaster(),pt=new THREE.Vector2();let dn=null;
cv.addEventListener('pointerdown',e=>{dn={x:e.clientX,y:e.clientY,t:performance.now()};try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointerup',e=>{if(!dn||mode=='free')return;const mv=Math.hypot(e.clientX-dn.x,e.clientY-dn.y),dt=performance.now()-dn.t;dn=null;if(mv>6||dt>500)return;
const r=cv.getBoundingClientRect();pt.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(pt,cam);
const hit=ray.intersectObjects(root.children.filter(g=>g.visible),true)[0];select(hit?hit.object.userData.part:null)});
function resize(){const w=Math.max(1,cv.clientWidth),h=Math.max(1,cv.clientHeight);renderer.setSize(w,h,false);cam.aspect=w/h;cam.fov=w/h<.8?50:38;cam.updateProjectionMatrix()}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));resize();
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();fail('WebGL 上下文丢失,请刷新页面')});
let first=true;
renderer.setAnimationLoop(()=>{if(Math.abs(tgt-ex)>.05){ex+=(tgt-ex)*.08;rg.value=ex;applyEx()}
if(tw){tw.t=Math.min(1,tw.t+.04);const s=sm(tw.t);cam.position.lerpVectors(tw.f,tw.to,s);ctl.target.lerpVectors(tw.ft,tw.tt,s);if(tw.t>=1)tw=null}
ctl.update();renderer.render(scene,cam);if(first){first=false;$('ld').style.display='none';$('stat').textContent='已就绪'}});
rg.value=18;ex=tgt=18;applyEx();drawList();window.__mcu={parts,select,view};
}catch(e){fail(e.message||String(e))}
</script></body></html>
